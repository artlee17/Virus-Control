<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Virus Wireless Control</title>
    
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#0d0d0d">

    <style>
        :root { --accent: #00f2ff; --bg: #0d0d0d; --panel: #1a1a1a; --active-bg: #00f2ff; --panic: #ff3333; }
        body { 
            background: var(--bg); color: white; font-family: sans-serif; 
            margin: 0; height: 100vh; display: flex; flex-direction: column; overflow: hidden;
            padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
        }
        
        .setup-bar { background: #222; padding: 10px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #444; gap: 8px; flex-shrink: 0; }
        
        .btn-header { border: none; padding: 10px 15px; border-radius: 4px; font-weight: bold; cursor: pointer; white-space: nowrap; font-size: 11px; text-transform: uppercase; }
        #btn-wake { background: #f39c12; color: #000; }
        #btn-fs { background: #444; color: #fff; }
        #btn-panic { background: var(--panic); color: #fff; }
        
        .main-container { display: flex; flex: 1; padding: 10px; gap: 15px; height: calc(100vh - 120px); min-height: 0; }
        
        /* Left Panel */
        .fader-section { display: flex; flex-direction: column; flex: 0.35; background: var(--panel); border-radius: 12px; padding: 10px; border: 1px solid #333; gap: 5px; }
        .v-fader-row { display: flex; flex: 1; justify-content: space-around; align-items: stretch; padding-bottom: 5px; min-height: 0; }
        .fader-group { display: flex; flex-direction: column; align-items: center; justify-content: space-between; width: 24%; }
        .fader-label { color: #888; font-size: 9px; text-transform: uppercase; text-align: center; font-weight: bold; }
        input[type=range][orient=vertical] { appearance: slider-vertical; width: 35px; height: 100%; background: #333; border-radius: 10px; outline: none; margin: 5px 0; }
        
        /* Master Slider */
        .macro-container { flex-shrink: 0; border-top: 1px solid #333; padding-top: 8px; display: flex; flex-direction: column; align-items: center; gap: 4px; }
        input[id=macro-slider] { appearance: none; width: 90%; height: 10px; background: #333; border-radius: 5px; outline: none; }
        input[id=macro-slider]::-webkit-slider-thumb { appearance: none; width: 22px; height: 22px; background: var(--accent); border-radius: 50%; cursor: pointer; border: 2px solid #000; }
        
        .val-indicator { color: var(--accent); font-family: monospace; font-size: 11px; font-weight: bold; background: #000; padding: 1px 5px; border-radius: 3px; }

        /* Right Panel */
        .button-section { flex: 0.65; display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; overflow-y: auto; padding-right: 5px; }
        .midi-pad { 
            background: #252525; border: none; border-radius: 8px; color: #bbb; 
            font-size: 15px; font-weight: 700; height: 55px; cursor: pointer;
            border-bottom: 4px solid #000; transition: all 0.1s ease;
            display: flex; align-items: center; justify-content: center; text-align: center;
        }
        .midi-pad.selected { background: var(--active-bg); color: #000; border-bottom: 0px; transform: translateY(3px); }

        #debug-box { background: #000; color: #0f0; font-family: monospace; font-size: 11px; height: 40px; padding: 5px 20px; border-top: 1px solid #333; flex-shrink: 0; line-height: 40px; }
    </style>
</head>
<body>

    <div class="setup-bar">
        <div style="font-weight: bold; font-size: 12px; color: var(--accent);">VIRUS NETWORK CONTROL</div>
        <button id="btn-wake" class="btn-header">Keep Awake</button>
        <button id="btn-fs" class="btn-header">Full Screen</button>
        <button id="btn-panic" class="btn-header">Panic</button>
    </div>

    <div class="main-container">
        <div class="fader-section">
            <div class="v-fader-row">
                <div class="fader-group"><div class="fader-label">Pitch</div><input type="range" id="pitch" orient="vertical" min="0" max="127" value="64"><div class="val-indicator" id="v-pitch">64</div></div>
                <div class="fader-group"><div class="fader-label">Mod W</div><input type="range" id="f1" orient="vertical" min="0" max="127" value="0" oninput="updateFader(1, this.value, 'v1')"><div class="val-indicator" id="v1">0</div></div>
                <div class="fader-group"><div class="fader-label">Rel</div><input type="range" id="f2" orient="vertical" min="0" max="127" value="0" oninput="updateFader(7, this.value, 'v2')"><div class="val-indicator" id="v2">0</div></div>
                <div class="fader-group"><div class="fader-label">Mod K</div><input type="range" id="f3" orient="vertical" min="0" max="127" value="0" oninput="updateFader(30, this.value, 'v3')"><div class="val-indicator" id="v3">0</div></div>
            </div>
            
            <div class="macro-container">
                <div class="fader-label">Master (CC 20: 0-64)</div>
                <input type="range" id="macro-slider" min="0" max="64" value="0" oninput="updateFader(20, this.value, 'v-macro')">
                <div class="val-indicator" id="v-macro">0</div>
            </div>
        </div>
        
        <div class="button-section" id="pad-grid"></div>
    </div>

    <div id="debug-box">> Network Ready: 10.0.0.47</div>

    <script>
        const PC_IP = "10.0.0.47";
        const PC_PORT = "4000";
        const MIDI_PORT_NAME = "loopMIDI Port";
        const logger = document.getElementById('debug-box');

        function log(m) { logger.innerText = "> " + m; }

        // --- NETWORK SENDER ---
        async function sendNetworkMidi(cc, val) {
            const url = `http://${PC_IP}:${PC_PORT}/sendmidi`;
            const midiData = {
                midiport: MIDI_PORT_NAME,
                status: 178, // Channel 3 CC
                data1: cc,
                data2: parseInt(val)
            };

            try {
                // 'no-cors' allows cross-origin requests without complex security handshakes
                fetch(url, {
                    method: 'POST',
                    body: JSON.stringify(midiData),
                    headers: { 'Content-Type': 'application/json' },
                    mode: 'no-cors' 
                });
                log(`Sent: CC ${cc} -> ${val}`);
            } catch (e) {
                log("Network Error: Check IP/Firewall");
            }
        }

        // --- WAKE LOCK ---
        let wakeLock = null;
        async function toggleWakeLock() {
            try {
                if ('wakeLock' in navigator) {
                    wakeLock = await navigator.wakeLock.request('screen');
                    document.getElementById('btn-wake').style.background = "#2ecc71";
                    log("Wake Lock: ACTIVE");
                }
            } catch (err) { log("Wake Lock Failed"); }
        }
        setInterval(async () => {
            if (wakeLock !== null && document.visibilityState === 'visible') {
                wakeLock = await navigator.wakeLock.request('screen');
            }
        }, 30000);

        // --- UI HANDLERS ---
        function updateFader(cc, val, displayId) {
            document.getElementById(displayId).innerText = val;
            sendNetworkMidi(cc, val);
        }

        const p = document.getElementById('pitch');
        p.oninput = () => {
            document.getElementById('v-pitch').innerText = p.value;
            // 226 is Pitch Bend on Channel 3
            sendNetworkMidi(0, p.value); // In relay mode, use status 226 or custom map
        };
        p.onmouseup = p.ontouchend = () => {
            p.value = 64; document.getElementById('v-pitch').innerText = 64;
            sendNetworkMidi(0, 64);
        };

        // --- PRESETS ---
        const presets = [
            { n: "A1 First", v: 0 }, { n: "B74 Short", v: 1 }, { n: "B74 Long", v: 2 },
            { n: "B3", v: 3 }, { n: "Indigo A84", v: 4 }, { n: "Virus A A18", v: 5 },
            { n: "Piano", v: 6 }, { n: "Movie Strings", v: 7 }, { n: "Organ Interstellar", v: 8 },
            { n: "Atmo Reality", v: 9 }, { n: "Pad Expanse", v: 10 }, { n: "Pad Outer Worlds", v: 11 },
            { n: "Pad Stellar", v: 12 }, { n: "Atmo Man of Steel", v: 13 }, { n: "Braaam Riser", v: 14 },
            { n: "Drone Analog", v: 15 }, { n: "Key Cinematic", v: 16 }, { n: "NinthHvn", v: 17 },
            { n: "I Made This", v: 18 }, { n: "Space Brass", v: 19 }, { n: "Crystal", v: 20 }
        ];

        const grid = document.getElementById('pad-grid');
        presets.forEach((item) => {
            const btn = document.createElement('button');
            btn.className = 'midi-pad';
            btn.innerText = item.n;
            btn.onclick = () => {
                document.querySelectorAll('.midi-pad').forEach(b => b.classList.remove('selected'));
                btn.classList.add('selected');
                sendNetworkMidi(27, item.v);
            };
            grid.appendChild(btn);
        });

        document.getElementById('btn-wake').onclick = toggleWakeLock;
        document.getElementById('btn-fs').onclick = () => {
            if (!document.fullscreenElement) document.documentElement.requestFullscreen();
            else document.exitFullscreen();
        };

        document.getElementById('btn-panic').onclick = () => {
            sendNetworkMidi(123, 0); // All notes off
            const resets = [{id:'f1', cc:1, disp:'v1'}, {id:'f2', cc:7, disp:'v2'}, {id:'f3', cc:30, disp:'v3'}];
            resets.forEach(item => { 
                document.getElementById(item.id).value = 0;
