<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Virus Master Horizontal</title>
    <style>
        :root { --red: #ff3333; --purple: #a044ff; --bg: #0d0d0d; --panel: #1a1a1a; }
        html, body { height: 100%; margin: 0; padding: 0; overflow: hidden; background: var(--bg); color: white; font-family: sans-serif; }
        body { display: flex; flex-direction: column; }
        
        .setup-bar { background: #222; padding: 5px 10px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #444; flex-shrink: 0; height: 42px; }
        .btn-header { border: none; padding: 6px 10px; border-radius: 4px; font-weight: bold; cursor: pointer; font-size: 10px; color: white; background: #444; }
        select { background: #333; color: white; border: 1px solid #555; padding: 5px; border-radius: 4px; flex-grow: 1; margin: 0 10px; font-size: 11px; }

        .tabs { display: flex; background: #111; border-bottom: 2px solid #333; flex-shrink: 0; height: 38px; }
        .tab { flex: 1; display: flex; align-items: center; justify-content: center; cursor: pointer; font-weight: bold; color: #666; font-size: 12px; }
        .v-mode .tab-v { color: var(--red); border-bottom: 3px solid var(--red); background: var(--panel); }
        .c-mode .tab-c { color: var(--purple); border-bottom: 3px solid var(--purple); background: var(--panel); }

        .main-container { display: flex; flex: 1; padding: 8px; gap: 10px; overflow: hidden; }
        
        /* Fader Section */
        .fader-section { width: 42%; background: var(--panel); border-radius: 10px; padding: 8px; border: 1px solid #333; display: flex; flex-direction: column; justify-content: space-between; }
        .v-fader-row { display: flex; flex: 1; justify-content: space-around; align-items: stretch; margin-bottom: 5px; }
        .fader-group { display: flex; flex-direction: column; align-items: center; justify-content: space-between; height: 100%; }
        .fader-label { color: #888; font-size: 9px; text-transform: uppercase; font-weight: bold; text-align: center; height: 12px; }
        
        /* Vertical Sliders */
        input[type=range][orient=vertical] { appearance: slider-vertical; width: 28px; height: 85%; background: #333; }
        
        /* Horizontal Master Slider */
        .macro-container { border-top: 1px solid #444; padding-top: 5px; }
        input[id=macro] { width: 100%; height: 20px; cursor: pointer; }

        .val-box { font-family: monospace; font-size: 10px; background: #000; padding: 2px 4px; border-radius: 3px; border: 1px solid #444; min-width: 22px; text-align: center; margin-top: 2px; }
        .v-mode .val-box { color: var(--red); border-color: var(--red); }
        .c-mode .val-box { color: var(--purple); border-color: var(--purple); }
        .v-mode input[type=range] { accent-color: var(--red); }
        .c-mode input[type=range] { accent-color: var(--purple); }

        /* Scrollable Button Area */
        .scroll-wrapper { width: 58%; height: 100%; overflow-y: scroll; -webkit-overflow-scrolling: touch; }
        .grid { display: none; grid-template-columns: repeat(2, 1fr); gap: 6px; padding-bottom: 40px; }
        .grid.active { display: grid; }
        
        .midi-pad { background: #252525; border: none; border-radius: 6px; color: #bbb; font-size: 11px; font-weight: 700; min-height: 48px; cursor: pointer; border-bottom: 3px solid #000; }
        .v-mode .midi-pad.selected { background: var(--red); color: white; border-bottom: 0px; transform: translateY(2px); }
        .c-mode .midi-pad.selected { background: var(--purple); color: white; border-bottom: 0px; transform: translateY(2px); }

        #debug { background: #000; color: #555; font-family: monospace; font-size: 9px; padding: 4px 10px; border-top: 1px solid #333; height: 22px; flex-shrink: 0; }
    </style>
</head>

        <select id="midi-select"><option>Port...</option></select>
        <button id="btn-fs" class="btn-header">FS</button>
        <button id="btn-panic" class="btn-header" style="background:#900">PANIC</button>
    </div>

    <div class="tabs">
        <div id="t-v" class="tab tab-v" onclick="switchMode('v')">VIRUS (CH 3)</div>
        <div id="t-c" class="tab tab-c" onclick="switchMode('c')">CINEMATIC (CH 4)</div>
    </div>

                <div class="fader-group"><div class="fader-label" id="lbl-3">Mod K</div><input type="range" id="f3" orient="vertical" min="0" max="127" value="0" oninput="upd(30, this.value, 'v-3')"><div class="val-box" id="v-3">0</div></div>
            </div>

            </div>
        </div>
