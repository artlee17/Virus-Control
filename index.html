<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Virus Control</title>
    <style>
        :root { --accent: #00f2ff; --bg: #0d0d0d; --panel: #1a1a1a; }
        body { background: var(--bg); color: white; font-family: sans-serif; margin: 0; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        
        .header { background: #222; padding: 10px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #444; }
        .container { display: flex; flex: 1; padding: 10px; gap: 10px; height: calc(100vh - 100px); }
        
        /* Left: Faders */
        .fader-section { flex: 0.4; background: var(--panel); border-radius: 8px; padding: 10px; display: flex; flex-direction: column; border: 1px solid #333; }
        .v-row { display: flex; flex: 1; justify-content: space-around; }
        .f-grp { display: flex; flex-direction: column; align-items: center; width: 23%; }
        input[type=range][orient=vertical] { appearance: slider-vertical; width: 30px; height: 100%; background: #333; }
        .val { color: var(--accent); font-family: monospace; font-size: 12px; margin-top: 5px; }

        /* Right: Pads */
        .pad-section { flex: 0.6; display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; overflow-y: auto; }
        .pad { background: #252525; border: none; border-radius: 6px; color: #fff; height: 55px; font-weight: bold; border-bottom: 4px solid #000; font-size: 12px; }
        .pad:active { background: var(--accent); color: #000; transform: translateY(2px); border-bottom: none; }

        #debug { background: #000; color: #0f0; font-family: monospace; font-size: 11px; height: 40px; padding: 0 15px; line-height: 40px; border-top: 1px solid #333; }
    </style>
</head>
