<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Virus Red USB</title>
    <style>
        :root { --accent: #ff3333; --bg: #0d0d0d; --panel: #1a1a1a; --active-bg: #ff3333; --panic: #990000; }
        body { background: var(--bg); color: white; font-family: 'Inter', sans-serif; margin: 0; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        
        .setup-bar { background: #222; padding: 10px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #444; gap: 8px; flex-shrink: 0; }
        select { background: #333; color: white; border: 1px solid #555; padding: 8px; border-radius: 4px; flex-grow: 1; max-width: 150px; font-size: 14px; }
        
        .btn-header { border: none; padding: 10px 10px; border-radius: 4px; font-weight: bold; cursor: pointer; white-space: nowrap; font-size: 11px; }
        #btn-init { background: var(--accent); color: #fff; }
        #btn-panic { background: var(--panic); color: #fff; }
        #btn-fs { background: #444; color: #fff; }

        /* Tabs for Dual Instrument Control */
        .tabs { display: flex; background: #222; border-bottom: 2px solid #333; }
        .tab { flex: 1; padding: 12px; text-align: center; cursor: pointer; background: #111; font-weight: bold; color: #666; }
        .tab.active { background: var(--panel); color: var(--accent); border-bottom: 3px solid var(--accent); }
        
        .main-container { display: flex; flex: 1; padding: 10px; gap: 15px; height: calc(100vh - 160px); min-height: 0; }
        
        .fader-section { display: flex; flex-direction: column; flex: 0.35; background: var(--panel); border-radius: 12px; padding: 10px; border: 1px solid #333; gap: 5px; }
        .v-fader-row { display: flex; flex: 1; justify-content: space-around; align-items: stretch; padding-bottom: 5px; min-height: 0; }
        .fader-group { display: flex; flex-direction: column; align-items: center; justify-content: space-between; width: 24%; }
        .fader-label { color: #888; font-size: 9px; text-transform: uppercase; text-align: center; font-weight: bold; }
        
        input[type=range][orient=vertical] { appearance: slider-vertical; width: 35px; height: 100%; background: #333; border-radius: 10px; outline: none; margin: 5px 0; }
        
        .macro-container { flex-shrink: 0; border-top: 1px solid #333; padding-top: 8px; display: flex; flex-direction: column; align-items: center; gap: 4px; }
        input[id=macro-slider] { appearance: none; width: 90%; height: 10px; background: #333; border-radius: 5px; outline: none; }
        input[id=macro-slider]::-webkit-slider-thumb { appearance: none; width: 22px; height: 22px; background: var(--accent); border-radius: 50%; cursor: pointer; border: 2px solid #fff; }
        
        .val-indicator { color: var(--accent); font-family: monospace; font-size: 11px; font-weight: bold; background: #000; padding: 1px 5px; border-radius: 3px; }

        .button-section { flex: 0.65; display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; overflow-y: auto; padding-right: 5px; }
        .midi-pad { background: #252525; border: none; border-radius: 8px; color: #bbb; font-size: 14px; font-weight: 700; height: 55px; cursor: pointer; border-bottom: 4px solid #000; transition: all 0.1s ease; }
        .midi-pad.selected { background: var(--accent); color: #fff; border-bottom: 0px; transform: translateY(3px); }

        #debug-box { background: #000; color: #ff3333; font-family: monospace; font-size: 11px; height: 40px; padding: 5px 20px; overflow-y: hidden; border-top: 1px solid #333; flex-shrink: 0; }
    </style>
</head>
<body>

    <div class="setup-bar">
        <button id="btn-init" class="btn-header">INIT USB</button>
        <select id="midi-select"><option>Midi Port...</option></select>
        <button id="btn-fs" class="btn-header">FULLSCREEN</button>
        <button id="btn-panic" class="btn-header">PANIC</button>
    </div>

    <div class="tabs">
        <div class="tab active" onclick="switchInst(3, this)">VIRUS (CH 3)</div>
        <div class="tab" onclick="switchInst(4, this)">CINEMATIC (CH 4)</div>
    </div>

    <div class="main-container">
        <div class="fader-section">
            <div class="v-fader-row">
                <div class="fader-group"><div class="fader-label">Pitch</div><input type="range" id="pitch" orient="vertical" min="0" max="127" value="64"><div class="val-indicator" id="v-pitch">64</div></div>
                <div class="fader-group"><div class="fader-label">Mod W</div><input type="range" id="f1" orient="vertical" min="0" max="127" value="0" oninput="updateFader(1, this.value, 'v1')"><div class="val-indicator" id="v1">0</div></div>
                <div class="fader-group"><div class="fader-label">Rel</div><input type="range" id="f2" orient="vertical" min="0" max="127" value="0" oninput="updateFader(7, this.value, 'v2')"><div class="val-indicator" id="v2">0</div></div>
                <div class="fader-group"><div class="fader-label">Mod K</div><input type="range" id="f3" orient="vertical" min="0" max="127" value="0" oninput="updateFader(30, this.value, 'v3')"><div class="val-indicator" id="v3">0</div></div>
            </div>
            <div class="macro-container">
                <div class="fader-label">Master (CC 20)</div>
                <input type="range" id="macro-slider" min="0" max="64" value="0" oninput="updateFader(20, this.value, 'v-macro')">
                <div class="val-indicator" id="v-macro">0</div>
            </div>
        </div>
        <div class="button-section" id="pad-grid"></div>
    </div>

    <div id="debug-box">> System Ready. Connect via USB.</div>

    <script>
        let midiOut = null;
        let outputs = [];
        let currentChannel = 0xB2; // Default CH 3 (0xB0 = CH1, 0xB2 = CH3)
        let wakeLock = null;

        const logger = document.getElementById('debug-box');
        function log(m) { logger.innerText = "> " + m; }

        async function requestWakeLock() {
            try {
                if ('wakeLock' in navigator) {
                    wakeLock = await navigator.wakeLock.request('screen');
                    log("Wake Lock Active.");
                }
            } catch (err) { log("WakeLock Error: " + err.message); }
        }

        async function initMidi() {
            await requestWakeLock();
            try {
                const access = await navigator.requestMIDIAccess({ sysex: true });
                const updatePorts = () => {
                    outputs = Array.from(access.outputs.values());
                    const selector = document.getElementById('midi-select');
                    selector.innerHTML = '';
                    outputs.forEach((out, i) => {
                        const opt = document.createElement('option');
                        opt.value = i; opt.innerText = out.name;
                        selector.appendChild(opt);
                    });
                    midiOut = outputs[0];
                    if(midiOut) log("Active: " + midiOut.name);
                };
                access.onstatechange = updatePorts;
                updatePorts();
                document.getElementById('midi-select').onchange = (e) => {
                    midiOut = outputs[e.target.value];
                    log("Switched to: " + midiOut.name);
                };
            } catch (err) { log("Error: " + err.message); }
        }

        function switchInst(ch, el) {
            currentChannel = 0xB0 + (ch - 1);
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            el.classList.add('active');
            log("Switched to Channel " + ch);
        }

        function updateFader(cc, val, displayId) {
            document.getElementById(displayId).innerText = val;
            if (midiOut) midiOut.send([currentChannel, cc, val]);
        }

        // Panic Button
        document.getElementById('btn-panic').onclick = () => {
            if (!midiOut) return;
            midiOut.send([currentChannel, 123, 0]); // All notes off
            log("PANIC: All Notes Off");
        };

        // Pitch Logic
        const p = document.getElementById('pitch');
        p.oninput = () => {
            document.getElementById('v-pitch').innerText = p.value;
            if (midiOut) midiOut.send([0xE0 + (currentChannel & 0x0F), 0, p.value]);
        };
        p.onmouseup = p.ontouchend = () => {
            p.value = 64; document.getElementById('v-pitch').innerText = 64;
            if (midiOut) midiOut.send([0xE0 + (currentChannel & 0x0F), 0, 64]);
        };

        // UI Prep
        document.getElementById('btn-init').onclick = initMidi;
        document.getElementById('btn-fs').onclick = () => {
            if (!document.fullscreenElement) document.documentElement.requestFullscreen();
            else document.exitFullscreen();
        };

        const presets = [
            { n: "A1 First", v: 0 }, { n: "B74 Short", v: 1 }, { n: "B74 Long", v: 2 },
            { n: "B3", v: 3 }, { n: "Indigo A84", v: 4 }, { n: "Virus A A18", v: 5 },
            { n: "Piano", v: 6 }, { n: "Movie Strings", v: 7 }, { n: "Organ Interstellar", v: 8 },
            { n: "Atmo Reality", v: 9 }, { n: "Pad Expanse", v: 10 }, { n: "Pad Outer Worlds", v: 11 }
        ];

        const grid = document.getElementById('pad-grid');
        presets.forEach((item) => {
            const btn = document.createElement('button');
            btn.className = 'midi-pad';
            btn.innerText = item.n;
            btn.onclick = () => {
                document.querySelectorAll('.midi-pad').forEach(b => b.classList.remove('selected'));
                btn.classList.add('selected');
                if (midiOut) midiOut.send([currentChannel, 27, item.v]);
            };
            grid.appendChild(btn);
        });
    </script>
</body>
</html>
