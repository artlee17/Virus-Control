<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MIDI Master</title>
    <style>
        :root { --accent: #ff3333; --bg: #0d0d0d; --panel: #1a1a1a; }
        .theme-lab { --accent: #a044ff; }
        body { background: var(--bg); color: white; font-family: sans-serif; margin: 0; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        .setup-bar { background: #222; padding: 5px 10px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #444; flex-shrink: 0; }
        .tabs { display: flex; background: #111; border-bottom: 2px solid #333; flex-shrink: 0; }
        .tab { flex: 1; padding: 12px; text-align: center; cursor: pointer; font-weight: bold; color: #666; font-size: 13px; text-transform: uppercase; }
        .tab.active { background: var(--panel); color: var(--accent); border-bottom: 3px solid var(--accent); }
        .btn-h { border: none; padding: 8px; border-radius: 4px; font-weight: bold; cursor: pointer; font-size: 10px; color: white; background: #444; }
        select { background: #333; color: white; border: 1px solid #555; padding: 6px; border-radius: 4px; flex-grow: 1; margin: 0 10px; max-width: 150px; }
        .main-container { display: flex; flex: 1; padding: 10px; gap: 15px; overflow: hidden; }
        .fader-section { width: 38%; background: var(--panel); border-radius: 12px; padding: 10px; border: 1px solid #333; display: flex; flex-direction: column; }
        .v-fader-row { display: flex; flex: 1; justify-content: space-around; align-items: stretch; margin-bottom: 5px; min-height: 0; }
        .fader-group { display: flex; flex-direction: column; align-items: center; justify-content: space-between; height: 100%; }
        .fader-label { color: #888; font-size: 9px; text-transform: uppercase; font-weight: bold; text-align: center; }
        input[type=range][orient=vertical] { appearance: slider-vertical; width: 32px; height: 80%; background: #333; accent-color: var(--accent); }
        .macro-container { border-top: 1px solid #333; padding-top: 8px; text-align: center; }
        input[id=macro] { width: 90%; height: 20px; accent-color: var(--accent); }
        .val-box { color: var(--accent); font-family: monospace; font-size: 11px; background: #000; padding: 2px 5px; border-radius: 4px; border: 1px solid #333; }
        .scroll-wrapper { width: 62%; height: 100%; overflow-y: scroll; -webkit-overflow-scrolling: touch; }
        .grid { display: none; grid-template-columns: repeat(3, 1fr); gap: 6px; padding-bottom: 60px; }
        .grid.active { display: grid; }
        .midi-pad { background: #252525; border: none; border-radius: 8px; color: #bbb; font-size: 10px; font-weight: 700; height: 55px; cursor: pointer; border-bottom: 4px solid #000; padding: 2px; }
        .midi-pad.selected { background: var(--accent); color: #000; border-bottom: 0px; transform: translateY(3px); }
        #debug { background: #000; color: #0f0; font-family: monospace; font-size: 10px; padding: 5px 20px; border-top: 1px solid #333; height: 30px; }
    </style>
</head>
<body id="app-body" class="v-mode">
    <div class="setup-bar">
        <button id="btn-init" class="btn-h" style="background:var(--accent); color:#000">INIT MIDI</button>
        <select id="midi-select"><option>Port...</option></select>
        <button id="btn-fs" class="btn-h">FS</button>
        <button id="btn-panic" class="btn-h" style="background:#900">PANIC</button>
    </div>
    <div class="tabs">
        <div id="tab-v" class="tab active" onclick="setPage('v')">Viper</div>
        <div id="tab-a" class="tab" onclick="setPage('a')">Analog Lab</div>
    </div>
    <div class="main-container">
        <div class="fader-section">
            <div class="v-fader-row">
                <div class="fader-group"><div class="fader-label">Pitch</div><input type="range" id="pitch" orient="vertical" min="0" max="127" value="64"><div class="val-box" id="v-p">64</div></div>
                <div class="fader-group"><div class="fader-label" id="lbl-1">Mod W</div><input type="range" id="f1" orient="vertical" min="0" max="127" value="0" oninput="upd(1, this.value, 'v1')"><div class="val-box" id="v1">0</div></div>
                <div class="fader-group"><div class="fader-label" id="lbl-2">Rel</div><input type="range" id="f2" orient="vertical" min="0" max="127" value="0" oninput="upd(7, this.value, 'v2')"><div class="val-box" id="v2">0</div></div>
                <div class="fader-group"><div class="fader-label" id="lbl-3">Mod K</div><input type="range" id="f3" orient="vertical" min="0" max="127" value="0" oninput="upd(30, this.value, 'v3')"><div class="val-box" id="v3">0</div></div>
            </div>
            <div class="macro-container">
                <div class="fader-label">Master (CC 20)</div>
                <input type="range" id="macro" min="0" max="64" value="0" oninput="upd(20, this.value, 'vm')">
                <div class="val-box" id="vm">0</div>
            </div>
        </div>
        <div class="scroll-wrapper">
            <div id="grid-v" class="grid active"></div>
            <div id="grid-a" class="grid"></div>
        </div>
    </div>
    <div id="debug">> Ready.</div>

    <script>
        let midi = null;
        let chan = 2; // Viper CH3
        const body = document.getElementById('app-body');
        const log = (m) => document.getElementById('debug').innerText = "> " + m;

        const viperPresets = ["A1 First", "B74 Short", "B74 Long", "B3", "Indigo A84", "Virus A18", "Piano", "Movie Str", "Organ Int", "Atmo Real", "Pad Exp", "Outer W", "Stellar", "Man Steel", "Braaam", "Drone", "Cinematic", "NinthHvn", "I Made This", "Space Brass", "Crystal"];
        const labPresets = ["Cinema Strings", "American Grand", "Sci-fi Strings", "Voices & Strings", "Pluton", "Storm", "Dune", "Awakening", "Golden Fields", "Lost Bells", "Other Worlds", "Post-Apocalypse", "The Thing Bass Seq"];

        function setPage(p) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.grid').forEach(g => g.classList.remove('active'));
            if (p === 'v') {
                chan = 2; body.classList.remove('theme-lab');
                document.getElementById('tab-v').classList.add('active');
                document.getElementById('grid-v').classList.add('active');
                setL("Mod W", "Rel", "Mod K");
            } else {
                chan = 0; body.classList.add('theme-lab');
                document.getElementById('tab-a').classList.add('active');
                document.getElementById('grid-a').classList.add('active');
                setL("Mod", "2", "3");
            }
        }

        function setL(l1, l2, l3) {
            document.getElementById('lbl-1').innerText = l1;
            document.getElementById('lbl-2').innerText = l2;
            document.getElementById('lbl-3').innerText = l3;
        }

        async function init() {
            try {
                const access = await navigator.requestMIDIAccess({ sysex: true });
                const outputs = Array.from(access.outputs.values());
                const sel = document.getElementById('midi-select');
                sel.innerHTML = '';
                outputs.forEach((out, i) => {
                    const opt = document.createElement('option');
                    opt.value = i; opt.innerText = out.name;
                    sel.appendChild(opt);
                });
                sel.onchange = (e) => { midi = outputs[e.target.value]; log("Selected: " + midi.name); };
                midi = outputs[0];
                if(midi) log("Connected: " + midi.name);
            } catch (err) { log("Error: " + err.message); }
        }

        function upd(cc, val, id) {
            document.getElementById(id).innerText = val;
            if (midi) midi.send([0xB0 + chan, cc, val]);
        }

        function sMsg(type, val, btn) {
            // Find the active grid container and only clear buttons within it
            const currentGrid = btn.parentElement;
            currentGrid.querySelectorAll('.midi-pad').forEach(b => b.classList.remove('selected'));
            
            btn.classList.add('selected');
            if (midi) {
                if (type === 'cc') {
                    midi.send([0xB0 + chan, 27, val]);
                    log(`CH${chan+1} CC27 Val ${val}`);
                } else {
                    midi.send([0xC0 + chan, val]);
                    log(`CH${chan+1} PC Val ${val}`);
                }
            }
        }

        const p = document.getElementById('pitch');
        p.oninput = () => {
            document.getElementById('v-p').innerText = p.value;
            if (midi) midi.send([0xE0 + chan, 0, p.value]);
        };
        p.onmouseup = p.ontouchend = () => {
            p.value = 64; document.getElementById('v-p').innerText = 64;
            if (midi) midi.send([0xE0 + chan, 0, 64]);
        };

        const gV = document.getElementById('grid-v');
        viperPresets.forEach((n, i) => {
            const b = document.createElement('button');
            b.className = 'midi-pad'; b.innerText = n;
            b.onclick = () => sMsg('cc', i, b);
            gV.appendChild(b);
        });

        const gA = document.getElementById('grid-a');
        labPresets.forEach((n, i) => {
            const b = document.createElement('button');
            b.className = 'midi-pad'; b.innerText = n;
            b.onclick = () => sMsg('pc', i + 1, b);
            gA.appendChild(b);
        });

        document.getElementById('btn-init').onclick = init;
        document.getElementById('btn-fs').onclick = () => {
            if (!document.fullscreenElement) document.documentElement.requestFullscreen();
            else document.exitFullscreen();
        };
        document.getElementById('btn-panic').onclick = () => {
            if (midi) midi.send([0xB0 + chan, 123, 0]);
            log("Panic Sent.");
        };
    </script>
</body>
</html>
