<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Virus Control v2.0</title>
    
    <style>
        :root { --accent: #00f2ff; --bg: #0d0d0d; --panel: #1a1a1a; }
        body { 
            background: var(--bg); color: white; font-family: sans-serif; 
            margin: 0; height: 100vh; display: flex; flex-direction: column; overflow: hidden;
        }
        
        .header { background: #222; padding: 10px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #444; }
        
        .container { display: flex; flex: 1; padding: 10px; gap: 15px; height: calc(100vh - 100px); }
        
        /* Fader Styling */
        .fader-section { flex: 0.35; background: var(--panel); border-radius: 12px; padding: 15px; display: flex; flex-direction: column; gap: 10px; border: 1px solid #333; }
        .fader-grid { display: flex; flex: 1; justify-content: space-around; }
        .f-grp { display: flex; flex-direction: column; align-items: center; justify-content: space-between; width: 23%; }
        .label { color: #888; font-size: 10px; font-weight: bold; text-transform: uppercase; }
        
        input[type=range][orient=vertical] { appearance: slider-vertical; width: 35px; height: 100%; background: #333; cursor: pointer; }
        
        .master-box { border-top: 1px solid #333; padding-top: 10px; text-align: center; }
        .h-slider { width: 90%; height: 12px; appearance: none; background: #333; border-radius: 6px; }
        .h-slider::-webkit-slider-thumb { appearance: none; width: 25px; height: 25px; background: var(--accent); border-radius: 50%; border: 2px solid #000; }
