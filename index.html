<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Virus & Cinematic Control</title>
    <style>
        :root { --accent: #ff3333; --bg: #0d0d0d; --panel: #1a1a1a; --active-bg: #ff3333; }
        
        html, body { height: 100%; margin: 0; padding: 0; overflow: hidden; background: var(--bg); color: white; font-family: 'Inter', sans-serif; }
        body { display: flex; flex-direction: column; }
        
        .setup-bar { background: #222; padding: 8px 15px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #444; flex-shrink: 0; }
        select { background: #333; color: white; border: 1px solid #555; padding: 6px; border-radius: 4px; flex-grow: 1; max-width: 140px; font-size: 13px; }
        
        .tabs { display: flex; background: #111; border-bottom: 2px solid #333; flex-shrink: 0; }
        .tab { flex: 1; padding: 12px; text-align: center; cursor: pointer; font-weight: bold; color: #666; font-size: 13px; transition: 0.2s; }
        .tab.active { background: var(--panel); color: var(--accent); border-bottom: 3px solid var(--accent); }
        
        .main-container { display: flex; flex: 1; padding: 10px; gap: 10px; overflow: hidden; height: 100%; }
        
        .fader-section { display: flex; flex-direction: column; width: 35%; background: var(--panel); border-radius: 12px; padding: 10px; border: 1px solid #333; }
        .v-fader-row { display: flex; flex: 1; justify-content: space-around; min-height: 0; }
        .fader-group { display: flex; flex-direction: column; align-items: center; justify-content: space-between; height: 100%; }
        .fader-label { color: #888; font-size: 9px; text-transform: uppercase; font-weight: bold; height: 25px; text-align: center; }
        
        input[type=range][orient=vertical] { appearance: slider-vertical; width: 32px; height: 70%; background: #333; }
        
        .macro-container { border-top: 1px solid #333; padding-top: 8px; display: flex; flex-direction: column; align-items: center; gap: 4px; }
        input[id=macro-slider] { appearance: none; width: 90%; height: 8px; background: #333; border-radius: 4px; }
        input[id=macro-slider]::-webkit-slider-thumb { appearance: none; width: 22px; height: 22px; background: var(--accent); border-radius: 50%; border: 2px solid #fff; }
        
        /* SCROLLABLE BUTTON SECTION */
        .button-section { width: 65%; display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; overflow-y: scroll; padding-bottom: 50px; -webkit-overflow-scrolling: touch; }
        .midi-pad { background: #252525; border: none; border-radius: 8px; color: #bbb; font-size: 13px; font-weight: 700; min-height: 60px; cursor: pointer; border-bottom: 4px solid #000; display: flex; align-items: center; justify-content: center; text-align: center; padding: 5px; }
        .midi-pad.selected { background: var(--accent); color: #fff; border-bottom: 0px; transform: translateY(3px); }

        #debug-box { background: #000; color: #ff3333; font-family: monospace; font-size: 10px; height: 30px; padding: 5px 15px; border-top: 1px solid #333; flex-shrink: 0; }
    </style>
</head>
<body>

    <div class="setup-bar">
        <button id="btn-init" style="background:#ff3333; color:white; border:none; padding:8px 12px; border-radius:4px; font-weight:bold;">INIT USB</button>
        <select id="midi-select"><option>Midi Port...</option></select>
        <button id="btn-panic" style="background:#990000; color:white; border:none; padding:8px 12px; border-radius:4px; font-weight:bold;">PANIC</button>
    </div>

    <div class="tabs">
        <div id="tab-v" class="tab active" onclick="updateLayout('virus')">VIRUS (CH 3)</div>
        <div id="tab-c" class="tab" onclick="updateLayout('cinematic')">CINEMATIC (CH 4)</div>
    </div>

    <div class="main-container">
        <div class="fader-section">
            <div class="v-fader-row">
                <div class="fader-group"><div class="fader-label" id="lbl-p">Pitch</div><input type="range" id="pitch" orient="vertical" min="0" max="127" value="64"><div class="val-indicator" id="v-pitch">64</div></div>
                <div class="fader-group"><div class="fader-label" id="lbl-f1">Mod W</div><input type="range" id="f1" orient="vertical" min="0" max="127" value="0" oninput="updateFader(1, this.value, 'v1')"><div class="val-indicator" id="v1">0</div></div>
                <div class="fader-group"><div class="fader-label" id="lbl-f2">Rel</div><input type="range" id="f2" orient="vertical" min="0" max="127" value="0" oninput="updateFader(7, this.value, 'v2')"><div class="val-indicator" id="v2">0</div></div>
                <div class="fader-group"><div class="fader-label" id="lbl-f3">Mod K</div><input type="range" id="f3" orient="vertical" min="0" max="127" value="0" oninput="updateFader(30, this.value, 'v3')"><div class="val-indicator" id="v3">0</div></div>
            </div>
            <div class="macro-container">
                <div class="fader-label">Master (CC 20)</div>
                <input type="range" id="macro-slider" min="0" max="64" value="0" oninput="updateFader(20, this.value, 'v-macro')">
                <div class="val-indicator" id="v-macro">0</div>
            </div>
        </div>
        <div class="button-section" id="pad-grid"></div>
    </div>

    <div id="debug-box">> System Ready.</div>

    <script>
        let midiOut = null;
        let activeChan = 2; // CH 3
        const grid = document.getElementById('pad-grid');

        const layouts = {
            virus: {
                chan: 2,
                labels: ["Pitch", "Mod W", "Release", "Mod K"],
                presets: [
                    { n: "A1 First", v: 0 }, { n: "B74 Short", v: 1 }, { n: "B74 Long", v: 2 },
                    { n: "B3 Organ", v: 3 }, { n: "Indigo 84", v: 4 }, { n: "Virus A18", v: 5 },
                    { n: "Piano", v: 6 }, { n: "Movie Str", v: 7 }, { n: "Organ Int", v: 8 },
                    { n: "Atmo Real", v: 9 }, { n: "Pad Exp", v: 10 }, { n: "Outer W", v: 11 }
                ]
            },
            cinematic: {
                chan: 3,
                labels: ["Exp", "Expr", "Lyc", "Timbre"],
                presets: [
                    { n: "Cine Strings", v: 0 }, { n: "Epic Horns", v: 1 }, { n: "Taiko Hit", v: 2 },
                    { n: "Stellar Pad", v: 3 }, { n: "Ether Drone", v: 4 }, { n: "Deep Sub", v: 5 },
                    { n: "Short Spicc", v: 6 }, { n: "Long Sustain", v: 7 }, { n: "Tremolo", v: 8 },
                    { n: "Woodwind", v: 9 }, { n: "Hybrid Hit", v: 10 }, { n: "Granular", v: 11 }
                ]
            }
        };

        function updateLayout(key) {
            const config = layouts[key];
            activeChan = config.chan;
            
            // Update UI Tabs
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.getElementById(key === 'virus' ? 'tab-v' : 'tab-c').classList.add('active');

            // Update Labels
            document.getElementById('lbl-p').innerText = config.labels[0];
            document.getElementById('lbl-f1').innerText = config.labels[1];
            document.getElementById('lbl-f2').innerText = config.labels[2];
            document.getElementById('lbl-f3').innerText = config.labels[3];

            // Rebuild Button Grid
            grid.innerHTML = '';
            config.presets.forEach(item => {
                const btn = document.createElement('button');
                btn.className = 'midi-pad';
                btn.innerText = item.n;
                btn.onclick = () => {
                    document.querySelectorAll('.midi-pad').forEach(b => b.classList.remove('selected'));
                    btn.classList.add('selected');
                    if (midiOut) midiOut.send([0xB0 + activeChan, 27, item.v]);
                };
                grid.appendChild(btn);
            });
            log("Layout Switched: " + key.toUpperCase());
        }

        async function initMidi() {
            try {
                const access = await navigator.requestMIDIAccess();
                const outputs = Array.from(access.outputs.values());
                const selector = document.getElementById('midi-select');
                selector.innerHTML = '';
                outputs.forEach((out, i) => {
                    let opt = document.createElement('option');
                    opt.value = i; opt.innerText = out.name;
                    selector.appendChild(opt);
                });
                midiOut = outputs[0];
                if(midiOut) log("Connected: " + midiOut.name);
            } catch (err) { log("Error: " + err); }
        }

        function updateFader(cc, val, displayId) {
            document.getElementById(displayId).innerText = val;
            if (midiOut) midiOut.send([0xB0 + activeChan, cc, val]);
        }

        const p = document.getElementById('pitch');
        p.oninput = () => {
            document.getElementById('v-pitch').innerText = p.value;
            if (midiOut) midiOut.send([0xE0 + activeChan, 0, p.value]);
        };
        p.onmouseup = p.ontouchend = () => {
            p.value = 64; document.getElementById('v-pitch').innerText = 64;
            if (midiOut) midiOut.send([0xE0 + activeChan, 0, 64]);
        };

        function log(m) { document.getElementById('debug-box').innerText = "> " + m; }

        document.getElementById('btn-init').onclick = initMidi;
        document.getElementById('btn-panic').onclick = () => {
            if (midiOut) midiOut.send([0xB0 + activeChan, 123, 0]);
        };

        // Initial Load
        updateLayout('virus');
    </script>
</body>
</html>
