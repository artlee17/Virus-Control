<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Virus & Cinematic Pro</title>
    <style>
        :root { --accent: #ff3333; --bg: #0d0d0d; --panel: #1a1a1a; }
        
        html, body { height: 100%; margin: 0; padding: 0; overflow: hidden; background: var(--bg); color: white; font-family: sans-serif; }
        body { display: flex; flex-direction: column; }
        
        /* Header */
        .setup-bar { background: #222; padding: 10px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #444; gap: 8px; flex-shrink: 0; }
        .btn-header { border: none; padding: 10px; border-radius: 4px; font-weight: bold; cursor: pointer; font-size: 11px; color: white; }
        select { background: #333; color: white; border: 1px solid #555; padding: 8px; border-radius: 4px; flex-grow: 1; }

        /* Tabs */
        .tabs { display: flex; background: #111; border-bottom: 2px solid #333; flex-shrink: 0; }
        .tab { flex: 1; padding: 15px; text-align: center; cursor: pointer; font-weight: bold; color: #666; }
        .tab.active { background: var(--panel); color: var(--accent); border-bottom: 3px solid var(--accent); }
        
        /* Main Layout */
        .main-container { display: flex; flex: 1; padding: 10px; gap: 15px; overflow: hidden; }
        
        /* Fader Column */
        .fader-section { width: 35%; background: var(--panel); border-radius: 12px; padding: 15px; border: 1px solid #333; display: flex; flex-direction: column; }
        .v-fader-row { display: flex; flex: 1; justify-content: space-around; align-items: stretch; margin-bottom: 10px; }
        .fader-group { display: flex; flex-direction: column; align-items: center; justify-content: space-between; }
        .fader-label { color: #888; font-size: 10px; text-transform: uppercase; font-weight: bold; margin-bottom: 5px; text-align: center; min-height: 24px; }
        
        input[type=range][orient=vertical] { appearance: slider-vertical; width: 35px; height: 100%; background: #333; }
        
        .macro-container { border-top: 1px solid #444; padding-top: 10px; text-align: center; }
        input[id=macro-slider] { width: 100%; margin: 10px 0; }

        /* Button Column */
        .button-section { width: 65%; height: 100%; overflow-y: auto; display: none; }
        .button-section.active { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; padding-bottom: 50px; }
        
        .midi-pad { background: #252525; border: none; border-radius: 8px; color: #bbb; font-size: 14px; font-weight: 700; min-height: 70px; cursor: pointer; border-bottom: 4px solid #000; }
        .midi-pad:active, .midi-pad.selected { background: var(--accent); color: white; border-bottom: 0px; transform: translateY(3px); }

        .val-indicator { color: var(--accent); font-family: monospace; font-size: 12px; background: #000; padding: 2px 6px; border-radius: 4px; margin-top: 5px; }
        #debug-box { background: #000; color: #ff3333; font-family: monospace; font-size: 11px; padding: 10px; border-top: 1px solid #333; }
    </style>
</head>
<body>

    <div class="setup-bar">
        <button id="btn-init" class="btn-header" style="background:var(--accent)">INIT USB</button>
        <select id="midi-select"><option>Select Port...</option></select>
        <button id="btn-fs" class="btn-header" style="background:#444">FULLSCREEN</button>
        <button id="btn-panic" class="btn-header" style="background:#900">PANIC</button>
    </div>

    <div class="tabs">
        <div id="tab-v-btn" class="tab active" onclick="showPanel('virus')">VIRUS (CH 3)</div>
        <div id="tab-c-btn" class="tab" onclick="showPanel('cine')">CINEMATIC (CH 4)</div>
    </div>

    <div class="main-container">
        <div class="fader-section">
            <div class="v-fader-row">
                <div class="fader-group"><div class="fader-label" id="l-p">Pitch</div><input type="range" id="pitch" orient="vertical" min="0" max="127" value="64"><div class="val-indicator" id="v-pitch">64</div></div>
                <div class="fader-group"><div class="fader-label" id="l-1">Mod W</div><input type="range" id="f1" orient="vertical" min="0" max="127" value="0" oninput="upd(1, this.value, 'v1')"><div class="val-indicator" id="v1">0</div></div>
                <div class="fader-group"><div class="fader-label" id="l-2">Rel</div><input type="range" id="f2" orient="vertical" min="0" max="127" value="0" oninput="upd(7, this.value, 'v2')"><div class="val-indicator" id="v2">0</div></div>
                <div class="fader-group"><div class="fader-label" id="l-3">Mod K</div><input type="range" id="f3" orient="vertical" min="0" max="127" value="0" oninput="upd(30, this.value, 'v3')"><div class="val-indicator" id="v3">0</div></div>
            </div>
            <div class="macro-container">
                <div class="fader-label">Master (CC 20)</div>
                <input type="range" id="macro-slider" min="0" max="64" value="0" oninput="upd(20, this.value, 'v-m')">
                <div class="val-indicator" id="v-m">0</div>
            </div>
        </div>

        <div id="panel-virus" class="button-section active">
            <button class="midi-pad" onclick="sendCC(27,0,this)">A1 First</button>
            <button class="midi-pad" onclick="sendCC(27,1,this)">B74 Short</button>
            <button class="midi-pad" onclick="sendCC(27,2,this)">B74 Long</button>
            <button class="midi-pad" onclick="sendCC(27,3,this)">B3 Organ</button>
            <button class="midi-pad" onclick="sendCC(27,4,this)">Indigo 84</button>
            <button class="midi-pad" onclick="sendCC(27,5,this)">Virus A18</button>
            <button class="midi-pad" onclick="sendCC(27,6,this)">Piano</button>
            <button class="midi-pad" onclick="sendCC(27,7,this)">Movie Str</button>
            <button class="midi-pad" onclick="sendCC(27,8,this)">Organ Int</button>
            <button class="midi-pad" onclick="sendCC(27,9,this)">Atmo Real</button>
            <button class="midi-pad" onclick="sendCC(27,10,this)">Pad Exp</button>
            <button class="midi-pad" onclick="sendCC(27,11,this)">Outer W</button>
            <button class="midi-pad" onclick="sendCC(27,12,this)">Stellar</button>
            <button class="midi-pad" onclick="sendCC(27,13,this)">Steel</button>
        </div>

        <div id="panel-cine" class="button-section">
            <button class="midi-pad" style="grid-column: span 2; height: 150px;" onclick="sendPC(0,this)">TEST (PC 1)</button>
        </div>
    </div>

    <div id="debug-box">> System Ready.</div>

    <script>
        let midiOut = null;
        let activeChan = 2; // Channel 3

        function log(m) { document.getElementById('debug-box').innerText = "> " + m; }

        function showPanel(mode) {
            document.querySelectorAll('.button-section').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            
            if(mode === 'virus') {
                activeChan = 2;
                document.getElementById('panel-virus').classList.add('active');
                document.getElementById('tab-v-btn').classList.add('active');
                document.getElementById('l-p').innerText = "Pitch";
                document.getElementById('l-1').innerText = "Mod W";
                document.getElementById('l-2').innerText = "Rel";
                document.getElementById('l-3').innerText = "Mod K";
            } else {
                activeChan = 3; // Channel 4
                document.getElementById('panel-cine').classList.add('active');
                document.getElementById('tab-c-btn').classList.add('active');
                document.getElementById('l-p').innerText = "Expr";
                document.getElementById('l-1').innerText = "Timbre";
                document.getElementById('l-2').innerText = "Vib";
                document.getElementById('l-3').innerText = "Dyn";
            }
            log("Switched to " + mode.toUpperCase());
        }

        async function init() {
            try {
                const access = await navigator.requestMIDIAccess();
                const outputs = Array.from(access.outputs.values());
                const sel = document.getElementById('midi-select');
                sel.innerHTML = '';
                outputs.forEach((out, i) => {
                    let opt = document.createElement('option');
                    opt.value = i; opt.innerText = out.name;
                    sel.appendChild(opt);
                });
                midiOut = outputs[0];
                log("Connected: " + (midiOut ? midiOut.name : "None"));
            } catch (e) { log("Error: " + e); }
        }

        function upd(cc, val, id) {
            document.getElementById(id).innerText = val;
            if (midiOut) midiOut.send([0xB0 + activeChan, cc, val]);
        }

        function sendCC(cc, val, btn) {
            document.querySelectorAll('.midi-pad').forEach(b => b.classList.remove('selected'));
            btn.classList.add('selected');
            if (midiOut) midiOut.send([0xB0 + activeChan, cc, val]);
        }

        function sendPC(val, btn) {
            document.querySelectorAll('.midi-pad').forEach(b => b.classList.remove('selected'));
            btn.classList.add('selected');
            if (midiOut) midiOut.send([0xC0 + activeChan, val]);
            log("PC Sent: " + (val + 1));
        }

        const p = document.getElementById('pitch');
        p.oninput = () => {
            document.getElementById('v-pitch').innerText = p.value;
            if (midiOut) midiOut.send([0xE0 + activeChan, 0, p.value]);
        };
        p.onmouseup = p.ontouchend = () => {
            p.value = 64; document.getElementById('v-pitch').innerText = 64;
            if (midiOut) midiOut.send([0xE0 + activeChan, 0, 64]);
        };

        document.getElementById('btn-init').onclick = init;
        document.getElementById('btn-fs').onclick = () => {
            if (!document.fullscreenElement) document.documentElement.requestFullscreen();
            else document.exitFullscreen();
        };
        document.getElementById('btn-panic').onclick = () => {
            if (midiOut) midiOut.send([0xB0 + activeChan, 123, 0]);
        };
    </script>
</body>
</html>
