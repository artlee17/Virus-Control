<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Virus CH12 / Cine CH14</title>
    <style>
        :root { --red: #ff3333; --purple: #a044ff; --bg: #0d0d0d; --panel: #1a1a1a; }
        html, body { height: 100%; margin: 0; padding: 0; overflow: hidden; background: var(--bg); color: white; font-family: sans-serif; }
        body { display: flex; flex-direction: column; }
        .setup-bar { background: #222; padding: 5px 10px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #444; flex-shrink: 0; height: 45px; }
        .btn-header { border: none; padding: 8px; border-radius: 4px; font-weight: bold; cursor: pointer; font-size: 10px; color: white; background: #444; }
        select { background: #333; color: white; border: 1px solid #555; padding: 6px; border-radius: 4px; flex-grow: 1; margin: 0 10px; font-size: 11px; }
        .tabs { display: flex; background: #111; border-bottom: 2px solid #333; flex-shrink: 0; height: 40px; }
        .tab { flex: 1; display: flex; align-items: center; justify-content: center; cursor: pointer; font-weight: bold; color: #666; font-size: 13px; }
        .v-mode .tab-v { color: var(--red); border-bottom: 3px solid var(--red); background: var(--panel); }
        .c-mode .tab-c { color: var(--purple); border-bottom: 3px solid var(--purple); background: var(--panel); }
        .main-container { display: flex; flex: 1; padding: 8px; gap: 10px; overflow: hidden; }
        .fader-section { width: 42%; background: var(--panel); border-radius: 10px; padding: 10px; border: 1px solid #333; display: flex; flex-direction: column; }
        .v-fader-row { display: flex; flex: 1; justify-content: space-around; margin-bottom: 5px; }
        .fader-group { display: flex; flex-direction: column; align-items: center; justify-content: space-between; height: 100%; }
        .fader-label { color: #888; font-size: 9px; text-transform: uppercase; font-weight: bold; height: 15px; }
        input[type=range][orient=vertical] { appearance: slider-vertical; width: 30px; height: 80%; background: #333; }
        .macro-container { border-top: 1px solid #444; padding-top: 5px; text-align: center; }
        input[id=macro] { width: 100%; height: 25px; }
        .val-box { font-family: monospace; font-size: 11px; background: #000; padding: 2px 5px; border-radius: 4px; border: 1px solid #444; min-width: 25px; text-align: center; }
        .v-mode .val-box { color: var(--red); border-color: var(--red); }
        .c-mode .val-box { color: var(--purple); border-color: var(--purple); }
        .v-mode input[type=range] { accent-color: var(--red); }
        .c-mode input[type=range] { accent-color: var(--purple); }
        .scroll-wrapper { width: 58%; height: 100%; overflow-y: scroll; -webkit-overflow-scrolling: touch; }
        .grid { display: none; grid-template-columns: repeat(2, 1fr); gap: 8px; padding-bottom: 60px; }
        .grid.active { display: grid; }
        .midi-pad { background: #252525; border: none; border-radius: 6px; color: #bbb; font-size: 11px; font-weight: 700; min-height: 55px; cursor: pointer; border-bottom: 3px solid #000; }
        .v-mode .midi-pad.selected { background: var(--red); color: white; border-bottom: 0px; transform: translateY(2px); }
        .c-mode .midi-pad.selected { background: var(--purple); color: white; border-bottom: 0px; transform: translateY(2px); }
        #debug { background: #000; color: #0f0; font-family: monospace; font-size: 10px; padding: 5px 10px; border-top: 1px solid #333; height: 25px; flex-shrink: 0; }
    </style>
</head>
<body id="app-body" class="v-mode">

    <div class="setup-bar">
        <button id="btn-init" class="btn-header" style="background:#ff3333">REFRESH MIDI</button>
        <select id="midi-select"><option>Tap Refresh...</option></select>
        <button id="btn-fs" class="btn-header">FS</button>
        <button id="btn-panic" class="btn-header" style="background:#900">PANIC</button>
    </div>

    <div class="tabs">
        <div id="t-v" class="tab tab-v" onclick="setMode('v')">VIRUS (CH 12)</div>
        <div id="t-c" class="tab tab-c" onclick="setMode('c')">CINEMATIC (CH 14)</div>
    </div>

    <div class="main-container">
        <div class="fader-section">
            <div class="v-fader-row">
                <div class="fader-group"><div class="fader-label" id="lbl-p">Pitch</div><input type="range" id="pitch" orient="vertical" min="0" max="127" value="64"><div class="val-box" id="v-p">64</div></div>
                <div class="fader-group"><div class="fader-label" id="lbl-1">Mod W</div><input type="range" id="f1" orient="vertical" min="0" max="127" value="0" oninput="upd(1, this.value, 'v-1')"><div class="val-box" id="v-1">0</div></div>
                <div class="fader-group"><div class="fader-label" id="lbl-2">Rel</div><input type="range" id="f2" orient="vertical" min="0" max="127" value="0" oninput="upd(7, this.value, 'v-2')"><div class="val-box" id="v-2">0</div></div>
                <div class="fader-group"><div class="fader-label" id="lbl-3">Mod K</div><input type="range" id="f3" orient="vertical" min="0" max="127" value="0" oninput="upd(30, this.value, 'v-3')"><div class="val-box" id="v-3">0</div></div>
            </div>
            <div class="macro-container">
                <div class="fader-label">Master (CC 20)</div>
                <input type="range" id="macro" min="0" max="64" value="0" oninput="upd(20, this.value, 'v-m')">
                <div class="val-box" id="v-m" style="margin: 0 auto;">0</div>
            </div>
        </div>

        <div class="scroll-wrapper">
            <div id="grid-v" class="grid active">
                <button class="midi-pad" onclick="sCC(27,0,this)">A1 First</button>
                <button class="midi-pad" onclick="sCC(27,1,this)">B74 Short</button>
                <button class="midi-pad" onclick="sCC(27,2,this)">B74 Long</button>
                <button class="midi-pad" onclick="sCC(27,3,this)">B3 Organ</button>
                <button class="midi-pad" onclick="sCC(27,4,this)">Indigo 84</button>
                <button class="midi-pad" onclick="sCC(27,5,this)">Virus A18</button>
                <button class="midi-pad" onclick="sCC(27,6,this)">Piano</button>
                <button class="midi-pad" onclick="sCC(27,7,this)">Movie Str</button>
                <button class="midi-pad" onclick="sCC(27,8,this)">Organ Int</button>
                <button class="midi-pad" onclick="sCC(27,9,this)">Atmo Real</button>
                <button class="midi-pad" onclick="sCC(27,10,this)">Pad Exp</button>
                <button class="midi-pad" onclick="sCC(27,11,this)">Outer W</button>
                <button class="midi-pad" onclick="sCC(27,12,this)">Stellar</button>
                <button class="midi-pad" onclick="sCC(27,13,this)">Steel</button>
                <button class="midi-pad" onclick="sCC(27,14,this)">Braaam</button>
                <button class="midi-pad" onclick="sCC(27,18,this)">I Made This</button>
                <button class="midi-pad" onclick="sCC(27,19,this)">Space Brass</button>
                <button class="midi-pad" onclick="sCC(27,20,this)">Crystal</button>
            </div>
            <div id="grid-c" class="grid">
                <button class="midi-pad" style="grid-column: span 2; height: 100px;" onclick="sPC(0,this)">TEST (PC 1)</button>
            </div>
        </div>
    </div>

    <div id="debug">> System Ready. Connect USB.</div>

    <script>
        let midiOut = null;
        let outputs = [];
        let activeChan = 11; // 0-indexed (11 = CH 12)

        const log = (m) => { document.getElementById('debug').innerText = "> " + m; };

        async function initMidi() {
            try {
                const access = await navigator.requestMIDIAccess();
                outputs = Array.from(access.outputs.values());
                const sel = document.getElementById('midi-select');
                sel.innerHTML = '';
                if (outputs.length === 0) { log("No devices! Check USB."); return; }
                outputs.forEach((out, i) => {
                    let opt = document.createElement('option');
                    opt.value = i; opt.innerText = out.name;
                    sel.appendChild(opt);
                });
                sel.onchange = (e) => {
                    midiOut = outputs[e.target.value];
                    log("Connected: " + midiOut.name);
                };
                midiOut = outputs[0];
                log("Active: " + midiOut.name);
            } catch (e) { log("Error: " + e); }
        }

        function setMode(mode) {
            const body = document.getElementById('app-body');
            if (mode === 'v') {
                activeChan = 11; body.className = 'v-mode';
                document.getElementById('grid-v').classList.add('active');
                document.getElementById('grid-c').classList.remove('active');
                document.getElementById('t-v').className = 'tab tab-v';
                document.getElementById('t-c').className = 'tab';
                setLabels("Pitch", "Mod W", "Rel", "Mod K");
            } else {
                activeChan = 13; body.className = 'c-mode';
                document.getElementById('grid-c').classList.add('active');
                document.getElementById('grid-v').classList.remove('active');
                document.getElementById('t-c').className = 'tab tab-c';
                document.getElementById('t-v').className = 'tab';
                setLabels("Expr", "Timbre", "Vib", "Dyn");
            }
        }

        function setLabels(p, f1, f2, f3) {
            document.getElementById('lbl-p').innerText = p;
            document.getElementById('lbl-1').innerText = f1;
            document.getElementById('lbl-2').innerText = f2;
            document.getElementById('lbl-3').innerText = f3;
        }

        function upd(cc, val, id) {
            document.getElementById(id).innerText = val;
            if (midiOut) {
                midiOut.send([0xB0 + activeChan, cc, val]);
            }
        }

        function sCC(cc, val, btn) {
            document.querySelectorAll('.midi-pad').forEach(b => b.classList.remove('selected'));
            btn.classList.add('selected');
            if (midiOut) {
                midiOut.send([0xB0 + activeChan, cc, val]);
                log("CH" + (activeChan+1) + " CC 27: " + val);
            }
        }

        function sPC(val, btn) {
            document.querySelectorAll('.midi-pad').forEach(b => b.classList.remove('selected'));
            btn.classList.add('selected');
            if (midiOut) {
                midiOut.send([0xC0 + activeChan, val]);
                log("CH" + (activeChan+1) + " PC: " + (val + 1));
            }
        }

        const p = document.getElementById('pitch');
        p.oninput = () => {
            document.getElementById('v-p').innerText = p.value;
            if (midiOut) midiOut.send([0xE0 + activeChan, 0, p.value]);
        };
        p.onmouseup = p.ontouchend = () => {
            p.value = 64; document.getElementById('v-p').innerText = 64;
            if (midiOut) midiOut.send([0xE0 + activeChan, 0, 64]);
        };

        document.getElementById('btn-init').onclick = initMidi;
        document.getElementById('btn-fs').onclick = () => {
            if (!document.fullscreenElement) document.documentElement.requestFullscreen();
            else document.exitFullscreen();
        };
        document.getElementById('btn-panic').onclick = () => {
            if (midiOut) midiOut.send([0xB0 + activeChan, 123, 0]);
        };
    </script>
</body>
</html>
