<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MIDI Master Tablet</title>
    <style>
        :root { --accent: #ff3333; --bg: #0d0d0d; --panel: #1a1a1a; }
        .theme-lab { --accent: #a044ff; }
        
        body { background: var(--bg); color: white; font-family: sans-serif; margin: 0; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        
        .setup-bar { background: #222; padding: 10px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #444; flex-shrink: 0; height: 50px; box-sizing: border-box; }
        .tabs { display: flex; background: #111; border-bottom: 2px solid #333; flex-shrink: 0; height: 55px; }
        .tab { flex: 1; display: flex; align-items: center; justify-content: center; cursor: pointer; font-weight: bold; color: #666; font-size: 16px; text-transform: uppercase; }
        .tab.active { background: var(--panel); color: var(--accent); border-bottom: 4px solid var(--accent); }

        .btn-h { border: none; padding: 10px 15px; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 12px; color: white; background: #444; }
        select { background: #333; color: white; border: 1px solid #555; padding: 8px; border-radius: 6px; flex-grow: 1; margin: 0 15px; max-width: 200px; font-size: 14px; }
        
        .main-container { display: flex; flex: 1; padding: 12px; gap: 15px; overflow: hidden; }
        
        .fader-section { width: 35%; background: var(--panel); border-radius: 15px; padding: 15px; border: 1px solid #333; display: flex; flex-direction: column; box-sizing: border-box; }
        .v-fader-row { display: flex; flex: 1; justify-content: space-around; align-items: stretch; margin-bottom: 10px; min-height: 0; }
        .fader-group { display: flex; flex-direction: column; align-items: center; justify-content: space-between; height: 100%; }
        .fader-label { color: #888; font-size: 11px; text-transform: uppercase; font-weight: bold; margin-bottom: 5px; }
        
        input[type=range][orient=vertical] { appearance: slider-vertical; width: 45px; height: 80%; background: #333; accent-color: var(--accent); }
        
        .macro-container { border-top: 2px solid #333; padding-top: 15px; text-align: center; }
        input[id=macro] { width: 95%; height: 35px; accent-color: var(--accent); cursor: pointer; }
        
        .val-box { color: var(--accent); font-family: monospace; font-size: 14px; background: #000; padding: 4px 8px; border-radius: 5px; border: 1px solid #333; margin-top: 5px; }

        .scroll-wrapper { width: 65%; height: 100%; overflow-y: scroll; -webkit-overflow-scrolling: touch; padding-right: 5px; }
        .grid { display: none; grid-template-columns: repeat(2, 1fr); gap: 10px; padding-bottom: 80px; }
        .grid.active { display: grid; }
        
        .midi-pad { 
            background: #252525; border: none; border-radius: 12px; color: #fff; 
            font-size: 16px; font-weight: 700; height: 85px; cursor: pointer; 
            border-bottom: 5px solid #000; transition: background 0.1s;
            display: flex; align-items: center; justify-content: center; text-align: center; padding: 10px;
        }
        .midi-pad.selected { background: var(--accent); color: #000; border-bottom: 0px; transform: translateY(4px); }

        #debug { background: #000; color: #0f0; font-family: monospace; font-size: 12px; padding: 8px 20px; border-top: 1px solid #333; height: 35px; flex-shrink: 0; }
    </style>
</head>
<body id="app-body" class="v-mode">

    <div class="setup-bar">
        <button id="btn-init" class="btn-h" style="background:var(--accent); color:#000">INIT MIDI</button>
        <select id="midi-select"><option>Port...</option></select>
        <button id="btn-fs" class="btn-h">FULLSCREEN</button>
        <button id="btn-panic" class="btn-h" style="background:#900">PANIC</button>
    </div>

    <div class="tabs">
        <div id="tab-v" class="tab active" onclick="setPage('v')">Viper</div>
        <div id="tab-a" class="tab" onclick="setPage('a')">Analog Lab</div>
    </div>

    <div class="main-container">
        <div class="fader-section">
            <div class="v-fader-row">
                <div class="fader-group"><div class="fader-label">Pitch</div><input type="range" id="pitch" orient="vertical" min="0" max="127" value="64"><div class="val-box" id="v-p">64</div></div>
                <div class="fader-group"><div class="fader-label" id="lbl-1">Mod W</div><input type="range" id="f1" orient="vertical" min="0" max="127" value="0" oninput="upd(1, this.value, 'v1')"><div class="val-box" id="v1">0</div></div>
                <div class="fader-group"><div class="fader-label" id="lbl-2">Rel</div><input type="range" id="f2" orient="vertical" min="0" max="127" value="0" oninput="upd(7, this.value, 'v2')"><div class="val-box" id="v2">0</div></div>
                <div class="fader-group"><div class="fader-label" id="lbl-3">Mod K</div><input type="range" id="f3" orient="vertical" min="0" max="127" value="0" oninput="upd(30, this.value, 'v3')"><div class="val-box" id="v3">0</div></div>
            </div>
            <div class="macro-container">
                <div class="fader-label">Master (CC 20)</div>
                <input type="range" id="macro" min="0" max="64" value="0" oninput="upd(20, this.value, 'vm')">
                <div class="val-box" id="vm">0</div>
            </div>
        </div>

        <div class="scroll-wrapper">
            <div id="grid-v" class="grid active"></div>
            <div id="grid-a" class="grid"></div>
        </div>
    </div>

    <div id="debug">> Tablet Optimized. Press INIT.</div>

    <script>
        let midi = null;
        let activeTab = 'v';
        let wakeLock = null;

        // Separate states for each tab
        const states = {
            v: { chan: 2, f1: 0, f2: 0, f3: 0, macro: 0, pitch: 64, maxMacro: 64 },
            a: { chan: 0, f1: 0, f2: 0, f3: 0, macro: 0, pitch: 64, maxMacro: 127 }
        };

        const viperPresets = ["A1 First", "B74 Short", "B74 Long", "B3", "Indigo A84", "Virus A18", "Piano", "Movie Str", "Organ Int", "Atmo Real", "Pad Exp", "Outer W", "Stellar", "Man Steel", "Braaam", "Drone", "Cinematic", "NinthHvn", "I Made This", "Space Brass", "Crystal"];
        const labPresets = ["Cinema Strings", "American Grand", "Sci-fi Strings", "Voices & Strings", "Pluton", "Storm", "Dune", "Awakening", "Golden Fields", "Lost Bells", "Other Worlds", "Post-Apocalypse", "The Thing Bass Seq"];

        async function requestWakeLock() {
            try {
                if ('wakeLock' in navigator) {
                    wakeLock = await navigator.wakeLock.request('screen');
                    document.getElementById('debug').innerText = "> Screen Wake Active.";
                }
            } catch (err) { console.error(`${err.name}, ${err.message}`); }
        }

        function setPage(p) {
            activeTab = p;
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.grid').forEach(g => g.classList.remove('active'));
            
            const body = document.getElementById('app-body');
            const macroInput = document.getElementById('macro');

            if (p === 'v') {
                body.classList.remove('theme-lab');
                document.getElementById('tab-v').classList.add('active');
                document.getElementById('grid-v').classList.add('active');
                setL("Mod W", "Rel", "Mod K");
            } else {
                body.classList.add('theme-lab');
                document.getElementById('tab-a').classList.add('active');
                document.getElementById('grid-a').classList.add('active');
                setL("Mod", "2", "3");
            }

            // Apply saved state for the current tab to the UI
            macroInput.max = states[p].maxMacro;
            macroInput.value = states[p].macro;
            document.getElementById('vm').innerText = states[p].macro;
            document.getElementById('f1').value = states[p].f1;
            document.getElementById('v1').innerText = states[p].f1;
            document.getElementById('f2').value = states[p].f2;
            document.getElementById('v2').innerText = states[p].f2;
            document.getElementById('f3').value = states[p].f3;
            document.getElementById('v3').innerText = states[p].f3;
            document.getElementById('pitch').value = states[p].pitch;
            document.getElementById('v-p').innerText = states[p].pitch;
        }

        function setL(l1, l2, l3) {
            document.getElementById('lbl-1').innerText = l1;
            document.getElementById('lbl-2').innerText = l2;
            document.getElementById('lbl-3').innerText = l3;
        }

        async function init() {
            requestWakeLock();
            try {
                const access = await navigator.requestMIDIAccess({ sysex: true });
                const outputs = Array.from(access.outputs.values());
                const sel = document.getElementById('midi-select');
                sel.innerHTML = '';
                outputs.forEach((out, i) => {
                    const opt = document.createElement('option');
                    opt.value = i; opt.innerText = out.name;
                    sel.appendChild(opt);
                });
                sel.onchange = (e) => { midi = outputs[e.target.value]; };
                midi = outputs[0];
                if(midi) document.getElementById('debug').innerText = "> Connected: " + midi.name;
            } catch (err) { document.getElementById('debug').innerText = "> Error: " + err.message; }
        }

        function upd(cc, val, id) {
            document.getElementById(id).innerText = val;
            const s = states[activeTab];
            // Save state based on CC
            if (cc === 1) s.f1 = val;
            if (cc === 7) s.f2 = val;
            if (cc === 30) s.f3 = val;
            if (cc === 20) s.macro = val;

            if (midi) midi.send([0xB0 + s.chan, cc, val]);
        }

        function sMsg(type, val, btn) {
            const currentGrid = btn.parentElement;
            currentGrid.querySelectorAll('.midi-pad').forEach(b => b.classList.remove('selected'));
            btn.classList.add('selected');
            const s = states[activeTab];
            if (midi) {
                if (type === 'cc') midi.send([0xB0 + s.chan, 27, val]);
                else midi.send([0xC0 + s.chan, val]);
            }
        }

        const p = document.getElementById('pitch');
        p.oninput = () => {
            const val = p.value;
            document.getElementById('v-p').innerText = val;
            states[activeTab].pitch = val;
            if (midi) midi.send([0xE0 + states[activeTab].chan, 0, val]);
        };
        p.onmouseup = p.ontouchend = () => {
            p.value = 64; 
            document.getElementById('v-p').innerText = 64;
            states[activeTab].pitch = 64;
            if (midi) midi.send([0xE0 + states[activeTab].chan, 0, 64]);
        };

        const gV = document.getElementById('grid-v');
        viperPresets.forEach((n, i) => {
            const b = document.createElement('button');
            b.className = 'midi-pad'; b.innerText = n;
            b.onclick = () => sMsg('cc', i, b);
            gV.appendChild(b);
        });

        const gA = document.getElementById('grid-a');
        labPresets.forEach((n, i) => {
            const b = document.createElement('button');
            b.className = 'midi-pad'; b.innerText = n;
            b.onclick = () => sMsg('pc', i + 1, b);
            gA.appendChild(b);
        });

        document.getElementById('btn-init').onclick = init;
        document.getElementById('btn-fs').onclick = () => {
            if (!document.fullscreenElement) document.documentElement.requestFullscreen();
            else document.exitFullscreen();
        };
        document.getElementById('btn-panic').onclick = () => {
            if (midi) midi.send([0xB0 + states[activeTab].chan, 123, 0]);
        };

        // Re-request wake lock if tab becomes visible again
        document.addEventListener('visibilitychange', () => {
            if (wakeLock !== null && document.visibilityState === 'visible') requestWakeLock();
        });
    </script>
</body>
</html>
