<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Custom MIDI Controller</title>
  <style>
    /* Global Styles */
    body {
      background-color: #1e1e1e;
      color: #ffffff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      margin: 0;
      padding: 20px;
      touch-action: manipulation; /* Prevents double-tap zooming on tablets */
    }

    h1, h2 { text-align: center; margin-top: 0; }

    /* MIDI Port Selector */
    .midi-setup {
      background-color: #2d2d2d;
      padding: 15px;
      border-radius: 8px;
      margin-bottom: 20px;
      text-align: center;
    }
    select, button.init-btn {
      padding: 10px;
      font-size: 16px;
      margin: 5px;
      border-radius: 4px;
      border: 1px solid #555;
      background: #333;
      color: white;
    }
    button.init-btn { cursor: pointer; background: #0078D7; border: none; }
    button.init-btn:active { background: #005A9E; }

    /* Tab Navigation */
    .tab-nav {
      display: flex;
      justify-content: center;
      margin-bottom: 20px;
    }
    .tab-btn {
      background-color: #333;
      color: #fff;
      border: none;
      padding: 15px 30px;
      margin: 0 5px;
      font-size: 16px;
      font-weight: bold;
      border-radius: 8px 8px 0 0;
      cursor: pointer;
      transition: background-color 0.2s;
    }
    .tab-btn.active { background-color: #555; }

    /* General Tab Content */
    .tab-content { display: none; border-radius: 8px; padding: 20px; }
    .tab-content.active { display: block; }

    /* Default Grid (Viper & Analog Lab) */
    .default-grid { display: flex; flex-wrap: wrap; justify-content: center; }
    .default-btn {
      background-color: #444; color: #fff; border: 1px solid #666;
      padding: 15px; margin: 5px; font-size: 14px;
      border-radius: 4px; cursor: pointer;
      width: calc(25% - 14px); box-sizing: border-box;
    }
    .default-btn:active { background-color: #666; }

    /* NTS-1 Specific Styles */
    #nts1-tab { background-color: #555555; }
    #nts1-tab h2 { color: #FFD700; text-transform: uppercase; }
    #nts1-tab .preset-btn {
      background-color: #000000; color: #FFD700; border: 2px solid #FFD700;
      padding: 15px; margin: 5px; font-size: 13px; font-weight: bold;
      text-transform: uppercase; border-radius: 4px; cursor: pointer;
      width: calc(20% - 14px); box-sizing: border-box;
      transition: background-color 0.1s;
    }
    #nts1-tab .preset-btn:active { background-color: #FFD700; color: #000000; }
    
    /* Pitch Fader Shared Styles */
    .pitch-container { margin-top: 30px; text-align: center; font-weight: bold; }
    #nts1-tab .pitch-container { color: #FFD700; }
    input[type=range] { width: 80%; margin-top: 15px; }

  </style>
</head>
<body>

  <h1>Control Surface</h1>

  <!-- MIDI Connection Setup -->
  <div class="midi-setup">
    <button class="init-btn" onclick="initMIDI()">INIT MIDI</button>
    <select id="midi-output-select">
      <option value="">Select MIDI Output...</option>
    </select>
  </div>

  <!-- Tab Navigation -->
  <div class="tab-nav">
    <button class="tab-btn active" onclick="switchTab(event, 'viper-tab')">VIPER</button>
    <button class="tab-btn" onclick="switchTab(event, 'analog-lab-tab')">ANALOG LAB</button>
    <button class="tab-btn" onclick="switchTab(event, 'nts1-tab')">NTS-1</button>
  </div>

  <!-- VIPER TAB -->
  <div id="viper-tab" class="tab-content active" style="background-color: #2b2b2b;">
    <h2>Viper</h2>
    <div class="default-grid">
      <!-- Plug your existing Viper buttons here -->
      <button class="default-btn">Viper Preset 1</button>
      <button class="default-btn">Viper Preset 2</button>
    </div>
    <div class="pitch-container">
      <label>PITCH BEND</label><br>
      <input type="range" min="0" max="127" value="64" 
             oninput="sendPitchMIDI(this.value, 1)" 
             onmouseup="resetPitch(this, 1)" ontouchend="resetPitch(this, 1)">
    </div>
  </div>

  <!-- ANALOG LAB TAB -->
  <div id="analog-lab-tab" class="tab-content" style="background-color: #223344;">
    <h2>Analog Lab</h2>
    <div class="default-grid">
      <!-- Plug your existing Analog Lab buttons here -->
      <button class="default-btn">AL Preset 1</button>
      <button class="default-btn">AL Preset 2</button>
    </div>
    <div class="pitch-container">
      <label>PITCH BEND</label><br>
      <input type="range" min="0" max="127" value="64" 
             oninput="sendPitchMIDI(this.value, 1)" 
             onmouseup="resetPitch(this, 1)" ontouchend="resetPitch(this, 1)">
    </div>
  </div>

  <!-- NTS-1 TAB -->
  <div id="nts1-tab" class="tab-content">
    <h2>NTS-1</h2>
    <div class="preset-grid" style="display: flex; flex-wrap: wrap; justify-content: center;">
      <!-- 25 Alphabetical Presets -->
      <button class="preset-btn" onclick="sendNTS1Burst('Blank Planet')">Blank Planet</button>
      <button class="preset-btn" onclick="sendNTS1Burst('Cave Formation')">Cave Formation</button>
      <button class="preset-btn" onclick="sendNTS1Burst('Copper Drone')">Copper Drone</button>
      <button class="preset-btn" onclick="sendNTS1Burst('Digital Bath')">Digital Bath</button>
      <button class="preset-btn" onclick="sendNTS1Burst('Distorted Vision')">Distorted Vis.</button>
      <button class="preset-btn" onclick="sendNTS1Burst('Event Horizon')">Event Horizon</button>
      <button class="preset-btn" onclick="sendNTS1Burst('Falling Star')">Falling Star</button>
      <button class="preset-btn" onclick="sendNTS1Burst('Glass Halo')">Glass Halo</button>
      <button class="preset-btn" onclick="sendNTS1Burst('Haunted Forest')">Haunted Forest</button>
      <button class="preset-btn" onclick="sendNTS1Burst('High Scores')">High Scores</button>
      <button class="preset-btn" onclick="sendNTS1Burst('Hot Buttered')">Hot Buttered</button>
      <button class="preset-btn" onclick="sendNTS1Burst('Ice Storm')">Ice Storm</button>
      <button class="preset-btn" onclick="sendNTS1Burst('Kinda Stringy')">Kinda Stringy</button>
      <button class="preset-btn" onclick="sendNTS1Burst('Massive Monks')">Massive Monks</button>
      <button class="preset-btn" onclick="sendNTS1Burst('Parabola Pulse')">Parabola Pulse</button>
      <button class="preset-btn" onclick="sendNTS1Burst('Passenger Drone')">Pass. Drone</button>
      <button class="preset-btn" onclick="sendNTS1Burst('Pins and Needles')">Pins & Needles</button>
      <button class="preset-btn" onclick="sendNTS1Burst('Smooth EP')">Smooth EP</button>
      <button class="preset-btn" onclick="sendNTS1Burst('Soopasaw')">Soopasaw</button>
      <button class="preset-btn" onclick="sendNTS1Burst('Space Gong')">Space Gong</button>
      <button class="preset-btn" onclick="sendNTS1Burst('Stellar Wash')">Stellar Wash</button>
      <button class="preset-btn" onclick="sendNTS1Burst('Third Eye Sweep')">3rd Eye Sweep</button>
      <button class="preset-btn" onclick="sendNTS1Burst('Trench Grinder')">Trench Grinder</button>
      <button class="preset-btn" onclick="sendNTS1Burst('Upwud')">Upwud</button>
      <button class="preset-btn" onclick="sendNTS1Burst('White Pony Tape')">White Pony Tape</button>
    </div>

    <div class="pitch-container">
      <label>PITCH BEND</label><br>
      <input type="range" min="0" max="127" value="64" 
             oninput="sendPitchMIDI(this.value, 1)" 
             onmouseup="resetPitch(this, 1)" ontouchend="resetPitch(this, 1)">
    </div>
  </div>

  <script>
    let midiAccess = null;
    let selectedOutput = null;

    // --- Tab Switching Logic ---
    function switchTab(evt, tabId) {
      const contents = document.getElementsByClassName("tab-content");
      for (let i = 0; i < contents.length; i++) {
        contents[i].classList.remove("active");
      }
      const buttons = document.getElementsByClassName("tab-btn");
      for (let i = 0; i < buttons.length; i++) {
        buttons[i].classList.remove("active");
      }
      document.getElementById(tabId).classList.add("active");
      evt.currentTarget.classList.add("active");
    }

    // --- Web MIDI Initialization ---
    async function initMIDI() {
      try {
        midiAccess = await navigator.requestMIDIAccess();
        populateOutputs();
        midiAccess.onstatechange = populateOutputs;
        alert("MIDI Initialized successfully!");
      } catch (err) {
        alert("Failed to initialize Web MIDI. Ensure you are using Chrome/Edge and site permissions are granted.");
        console.error(err);
      }
    }

    function populateOutputs() {
      if (!midiAccess) return;
      const select = document.getElementById("midi-output-select");
      select.innerHTML = '<option value="">Select MIDI Output...</option>';
      
      for (let output of midiAccess.outputs.values()) {
        const option = document.createElement("option");
        option.value = output.id;
        option.text = output.name;
        select.appendChild(option);
      }

      select.onchange = (e) => {
        selectedOutput = midiAccess.outputs.get(e.target.value);
      };
    }

    // --- NTS-1 CC Macro Dictionary ---
    // Expand these arrays to include all specific CC values for each patch
    const nts1Presets = {
      "Blank Planet": [ {cc: 53, val: 0}, {cc: 42, val: 18}, {cc: 88, val: 50}, {cc: 117, val: 1} ],
      "Cave Formation": [ {cc: 53, val: 2}, {cc: 42, val: 22}, {cc: 90, val: 4} ], 
      "Copper Drone": [ {cc: 53, val: 3}, {cc: 54, val: 102}, {cc: 42, val: 8} ],
      "Digital Bath": [ {cc: 53, val: 1}, {cc: 42, val: 12}, {cc: 88, val: 2}, {cc: 90, val: 4} ],
      "Event Horizon": [ {cc: 53, val: 0}, {cc: 54, val: 64}, {cc: 42, val: 22}, {cc: 88, val: 2} ],
      // Placeholder for remaining—fill in using the provided CC lists
      "Glass Halo": [ {cc: 53, val: 1}, {cc: 42, val: 14}, {cc: 88, val: 1}, {cc: 89, val: 2} ] 
    };

    function sendNTS1Burst(presetName) {
      if (!selectedOutput) {
        alert("Please select a MIDI output first!");
        return;
      }
      const ccBurst = nts1Presets[presetName];
      if (ccBurst) {
        ccBurst.forEach(msg => {
          // Send CC to MIDI Channel 1 (0xB0)
          selectedOutput.send([0xB0, msg.cc, msg.val]);
        });
        console.log(`Sent ${presetName}`);
      } else {
        console.log(`Preset data for ${presetName} not yet mapped in JS.`);
      }
    }

    // --- Universal Pitch Bend Logic ---
    function sendPitchMIDI(val, channel) {
      if (!selectedOutput) return;
      // Channel 1 Pitch Bend is 0xE0
      let statusByte = 0xE0 + (channel - 1);
      // Simplify 14-bit pitch bend mapping from a 0-127 slider
      // Center is LSB 0, MSB 64
      let msb = parseInt(val); 
      let lsb = 0; 
      selectedOutput.send([statusByte, lsb, msb]);
    }

    function resetPitch(slider, channel) {
      slider.value = 64;
      sendPitchMIDI(64, channel);
    }
  </script>
</body>
</html>
