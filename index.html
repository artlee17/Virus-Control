<!DOCTYPE html>
<html>
<head>
<title>MIDI Controller</title>
<style>
  body { background-color: #111; color: #eee; font-family: sans-serif; display: flex; flex-direction: column; height: 100vh; margin: 0; }
  #header { background-color: #222; padding: 10px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #333; }
  #main { display: flex; flex: 1; overflow: hidden; }
  #faders { width: 300px; padding: 20px; display: flex; justify-content: space-around; border-right: 1px solid #333; }
  .fader-container { display: flex; flex-direction: column; align-items: center; }
  input[type=range] { writing-mode: bt-lr; -webkit-appearance: slider-vertical; width: 50px; height: 300px; padding: 0 5px; }
  #buttons { flex: 1; padding: 20px; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; overflow-y: auto; }
  button { padding: 20px; font-size: 1.1em; background-color: #333; color: #eee; border: 1px solid #444; border-radius: 5px; cursor: pointer; }
  button:active { background-color: #555; }
  #debug { padding: 10px; background-color: #000; color: #0f0; font-family: monospace; font-size: 0.9em; }
</style>
</head>
<body>

<div id="header">
  <button onclick="initMIDI()">Connect MIDI</button>
  <div id="device-name">No device connected</div>
  <button onclick="toggleFS()">Fullscreen</button>
</div>

<div id="main">
  <div id="faders">
    <div class="fader-container">
      <label>Pitch</label>
      <input type="range" min="0" max="127" value="64" id="pitch-fader">
      <span id="pitch-val">64</span>
    </div>
    <div class="fader-container">
      <label>Mod</label>
      <input type="range" min="0" max="127" value="0" id="mod-fader">
      <span id="mod-val">0</span>
    </div>
  </div>

  <div id="buttons">
    <button onclick="sendCC(27, 0)">A1 First</button>
    <button onclick="sendCC(27, 1)">B74 Short</button>
    <button onclick="sendCC(27, 2)">B74 Long</button>
    <button onclick="sendCC(27, 3)">B3 Organ</button>
    <button onclick="sendCC(27, 4)">Indigo 84</button>
    <button onclick="sendCC(27, 5)">Virus A18</button>
    <button onclick="sendCC(27, 6)">Piano</button>
    <button onclick="sendCC(27, 7)">Movie Str</button>
    <button onclick="sendCC(27, 8)">Organ Int</button>
    <button onclick="sendCC(27, 9)">Atmo Real</button>
  </div>
</div>

<div id="debug">Ready</div>

<script>
let midiOutput = null;

function log(msg) {
  document.getElementById('debug').innerText = msg;
}

async function initMIDI() {
  try {
    const midiAccess = await navigator.requestMIDIAccess();
    const outputs = Array.from(midiAccess.outputs.values());
    if (outputs.length > 0) {
      midiOutput = outputs[0];
      document.getElementById('device-name').innerText = midiOutput.name;
      log("Connected to " + midiOutput.name);
    } else {
      log("No MIDI output devices found");
    }
  } catch (err) {
    log("MIDI access denied: " + err);
  }
}

function sendCC(cc, value) {
  if (midiOutput) {
    midiOutput.send([0xB0, cc, value]);
    log("Sent CC " + cc + ": " + value);
  }
}

document.getElementById('mod-fader').addEventListener('input', (e) => {
  const val = parseInt(e.target.value);
  document.getElementById('mod-val').innerText = val;
  sendCC(1, val);
});

const pf = document.getElementById('pitch-fader');
pf.addEventListener('input', (e) => {
  const val = parseInt(e.target.value);
  document.getElementById('pitch-val').innerText = val;
  if (midiOutput) midiOutput.send([0xE0, 0, val]);
});

pf.addEventListener('touchend', () => {
  pf.value = 64;
  document.getElementById('pitch-val').innerText = 64;
  if (midiOutput) midiOutput.send([0xE0, 0, 64]);
});

function toggleFS() {
  if (!document.fullscreenElement) {
    document.documentElement.requestFullscreen();
  } else {
    document.exitFullscreen();
  }
}
</script>

</body>
</html>
