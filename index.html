<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Virus Red Mobile</title>
    <style>
        :root { --accent: #ff0000; --bg: #0d0d0d; --panel: #1a1a1a; --header-h: 55px; }
        
        * { box-sizing: border-box; }
        
        body { 
            background: var(--bg); color: white; font-family: sans-serif; 
            margin: 0; padding: 0; display: flex; flex-direction: column; 
            height: 100vh; width: 100vw; overflow: hidden;
        }
        
        /* Fixed Header to ensure it doesn't disappear */
        .header-fixed {
            position: sticky; top: 0; width: 100%; z-index: 100;
            background: #222; border-bottom: 2px solid #444; flex-shrink: 0;
        }

        .tab-bar { display: flex; height: var(--header-h); }
        .tab { 
            flex: 1; display: flex; align-items: center; justify-content: center;
            font-weight: bold; font-size: 13px; color: #666; text-transform: uppercase; 
            border-bottom: 4px solid transparent; transition: 0.2s;
        }
        .tab.active { color: var(--accent); border-bottom-color: var(--accent); background: #111; }

        /* Main Scrollable Content */
        .content-area { 
            flex: 1; overflow-y: auto; overflow-x: hidden;
            padding: 15px; padding-bottom: 80px; /* Space for debug footer */
            -webkit-overflow-scrolling: touch;
        }

        .main-container { display: none; flex-direction: column; gap: 15px; }
        .main-container.active { display: flex; }
        
        /* Fader Styling */
        .fader-section { background: var(--panel); border-radius: 12px; padding: 15px; border: 1px solid #333; }
        .v-fader-row { display: flex; justify-content: space-around; height: 160px; margin-bottom: 15px; }
        .f-grp { display: flex; flex-direction: column; align-items: center; width: 22%; }
        .label { color: #888; font-size: 10px; font-weight: bold; margin-bottom: 8px; text-transform: uppercase; }
        
        input[type=range].v-sld {
            appearance: slider-vertical; width: 32px; height: 100%; background: #333; outline: none;
        }

        .macro-container { border-top: 1px solid #333; padding-top: 15px; text-align: center; }
        input.h-sld { appearance: none; width: 100%; height: 10px; background: #333; border-radius: 5px; outline: none; margin: 10px 0; }
        input.h-sld::-webkit-slider-thumb { appearance: none; width: 24px; height: 24px; background: var(--accent); border-radius: 50%; border: 2px solid #000; }
        
        .val { color: var(--accent); font-family: monospace; font-size: 12px; margin-top: 5px; }

        /* Grid Styling - Ensuring first row is visible */
        .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 10px; }
        .pad { 
            background: #252525; border: none; border-radius: 6px; color: #eee; 
            font-size: 12px; font-weight: bold; height: 55px; border-bottom: 4px solid #000;
        }
        .pad:active { background: var(--accent); color: white; transform: translateY(2px); border-bottom: none; }

        #debug { 
            position: fixed; bottom: 0; width: 100%;
            background: #000; color: var(--accent); font-family: monospace; 
            font-size: 11px; padding: 10px 15px; border-top: 1px solid #333; z-index: 101;
        }
    </style>
</head>
<body>

    <div class="header-fixed">
        <div class="tab-bar">
            <div class="tab active" onclick="switchTab('virus')">Virus</div>
            <div class="tab" onclick="switchTab('cinematic')">Cinematic</div>
        </div>
    </div>

                    <div class="f-grp"><div class="label">Cut</div><input type="range" class="v-sld" oninput="u(3,30,this.value,'v3')"><div class="val" id="v3">0</div></div>
                </div>

                    <input type="range" class="h-sld" oninput="u(3,20,this.value,'v4')">

                </div>
            </div>
            <div class="grid" id="v-pads"></div>
        </div>
