<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Virus MIDI Control</title>
    
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#0d0d0d">
    <link rel="manifest" href="data:application/manifest+json,{'name':'Virus MIDI','short_name':'Virus','start_url':'.','display':'standalone','background_color':'#0d0d0d','theme_color':'#0d0d0d','orientation':'landscape'}">

    <style>
        :root { --accent: #ff0000; --bg: #0d0d0d; --panel: #1a1a1a; --active-bg: #ff0000; --panic: #ff3333; }
        body { 
            background: var(--bg); color: white; font-family: 'Inter', sans-serif; 
            margin: 0; height: 100vh; display: flex; flex-direction: column; overflow: hidden;
            padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
        }
        
        .setup-bar { background: #222; padding: 10px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #444; gap: 8px; flex-shrink: 0; }
        select { background: #333; color: white; border: 1px solid #555; padding: 8px; border-radius: 4px; flex-grow: 1; max-width: 150px; font-size: 14px; }
        
        .btn-header { border: none; padding: 10px 10px; border-radius: 4px; font-weight: bold; cursor: pointer; white-space: nowrap; font-size: 11px; }
        #btn-init { background: var(--accent); color: #fff; }
        #btn-panic { background: var(--panic); color: #fff; }
        #btn-fs { background: #444; color: #fff; }
        #btn-wake { background: #f39c12; color: #000; }
