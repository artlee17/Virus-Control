<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Virus Red USB</title>
    <style>
        :root { --accent: #ff3333; --bg: #0d0d0d; --panel: #1a1a1a; --active-bg: #ff3333; --panic: #990000; }
        
        /* Fixed height issue for mobile */
        html, body { height: 100%; margin: 0; padding: 0; overflow: hidden; background: var(--bg); color: white; font-family: 'Inter', sans-serif; }
        body { display: flex; flex-direction: column; }
        
        .setup-bar { background: #222; padding: 8px 15px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #444; flex-shrink: 0; }
        select { background: #333; color: white; border: 1px solid #555; padding: 6px; border-radius: 4px; flex-grow: 1; max-width: 140px; font-size: 13px; }
        
        .btn-header { border: none; padding: 8px 10px; border-radius: 4px; font-weight: bold; cursor: pointer; font-size: 11px; }
        #btn-init { background: var(--accent); color: #fff; }
        #btn-panic { background: var(--panic); color: #fff; }

        .tabs { display: flex; background: #111; border-bottom: 2px solid #333; flex-shrink: 0; }
        .tab { flex: 1; padding: 10px; text-align: center; cursor: pointer; font-weight: bold; color: #666; font-size: 12px; }
        .tab.active { background: var(--panel); color: var(--accent); border-bottom: 3px solid var(--accent); }
        
        /* Container and scrolling fixes */
        .main-container { display: flex; flex: 1; padding: 10px; gap: 10px; overflow: hidden; }
        
        .fader-section { display: flex; flex-direction: column; width: 35%; background: var(--panel); border-radius: 12px; padding: 10px; border: 1px solid #333; }
        .v-fader-row { display: flex; flex: 1; justify-content: space-around; min-height: 0; }
        .fader-group { display: flex; flex-direction: column; align-items: center; justify-content: space-between; height: 100%; }
        .fader-label { color: #888; font-size: 8px; text-transform: uppercase; font-weight: bold; }
        
        input[type=range][orient=vertical] { appearance: slider-vertical; width: 28px; height: 75%; background: #333; }
        
        .macro-container { border-top: 1px solid #333; padding-top: 8px; display: flex; flex-direction: column; align-items: center; gap: 4px; }
        input[id=macro-slider] { appearance: none; width: 90%; height: 8px; background: #333; border-radius: 4px; }
        input[id=macro-slider]::-webkit-slider-thumb { appearance: none; width: 20px; height: 20px; background: var(--accent); border-radius: 50%; border: 2px solid #fff; }
        
        .val-indicator { color: var(--accent); font-family: monospace; font-size: 10px; background: #000; padding: 1px 4px; border-radius: 3px; }

        /* The Button Grid with Scrolling enabled */
        .button-section { width: 65%; display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px; overflow-y: auto; padding-right: 5px; -webkit-overflow-scrolling: touch; }
        .midi-pad { background: #252525; border: none; border-radius: 6px; color: #bbb; font-size: 12px; font-weight: 700; height: 50px; cursor: pointer; border-bottom: 3px solid #000; }
        .midi-pad.selected { background: var(--accent); color: #fff; border-bottom: 0px; transform: translateY(2px); }

        #debug-box { background: #000; color: #ff3333; font-family: monospace; font-size: 10px; height: 35px; padding: 5px 15px; border-top: 1px solid #333; flex-shrink: 0; }
    </style>
</head>
<body>

    <div class="setup-bar">
        <button id="btn-init" class="btn-header">INIT USB</button>
        <select id="midi-select"><option>Port...</option></select>
        <button id="btn-panic" class="btn-header">PANIC</button>
    </div>

    <div class="tabs">
        <div id="tab-v" class="tab active" onclick="switchInst(3, 'tab-v')">VIRUS (CH 3)</div>
        <div id="tab-c" class="tab" onclick="switchInst(4, 'tab-c')">CINEMATIC (CH 4)</div>
    </div>

    <div class="main-container">
        <div class="fader-section">
            <div class="v-fader-row">
                <div class="fader-group"><div class="fader-label">Pitch</div><input type="range" id="pitch" orient="vertical" min="0" max="127" value="64"><div class="val-indicator" id="v-pitch">64</div></div>
                <div class="fader-group"><div class="fader-label">Mod</div><input type="range" id="f1" orient="vertical" min="0" max="127" value="0" oninput="updateFader(1, this.value, 'v1')"><div class="val-indicator" id="v1">0</div></div>
                <div class="fader-group"><div class="fader-label">Rel</div><input type="range" id="f2" orient="vertical" min="0" max="127" value="0" oninput="updateFader(7, this.value, 'v2')"><div class="val-indicator" id="v2">0</div></div>
                <div class="fader-group"><div class="fader-label">ModK</div><input type="range" id="f3" orient="vertical" min="0" max="127" value="0" oninput="updateFader(30, this.value, 'v3')"><div class="val-indicator" id="v3">0</div></div>
            </div>
            <div class="macro-container">
                <div class="fader-label">Master (CC 20)</div>
                <input type="range" id="macro-slider" min="0" max="64" value="0" oninput="updateFader(20, this.value, 'v-macro')">
                <div class="val-indicator" id="v-macro">0</div>
            </div>
        </div>
        <div class="button-section" id="pad-grid"></div>
    </div>

    <div id="debug-box">> System Ready. Connect USB.</div>

    <script>
        let midiOut = null;
        let outputs = [];
        let activeChan = 2; // 0-indexed (2 = Channel 3)

        const logger = document.getElementById('debug-box');
        function log(m) { logger.innerText = "> " + m; }

        async function initMidi() {
            try {
                const access = await navigator.requestMIDIAccess();
                outputs = Array.from(access.outputs.values());
                const selector = document.getElementById('midi-select');
                selector.innerHTML = '';
                outputs.forEach((out, i) => {
                    let opt = document.createElement('option');
                    opt.value = i; opt.innerText = out.name;
                    selector.appendChild(opt);
                });
                midiOut = outputs[0];
                if(midiOut) log("Connected: " + midiOut.name);
            } catch (err) { log("MIDI Error: " + err); }
        }

        function switchInst(chanNum, tabId) {
            activeChan = chanNum - 1; // Convert to 0-indexed
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
            log("Switched to MIDI Channel " + chanNum);
        }

        function updateFader(cc, val, displayId) {
            document.getElementById(displayId).innerText = val;
            if (midiOut) midiOut.send([0xB0 + activeChan, cc, val]);
        }

        // Pitch Bend (Standard 7-bit version)
        const p = document.getElementById('pitch');
        p.oninput = () => {
            document.getElementById('v-pitch').innerText = p.value;
            if (midiOut) midiOut.send([0xE0 + activeChan, 0, p.value]);
        };
        p.onmouseup = p.ontouchend = () => {
            p.value = 64; document.getElementById('v-pitch').innerText = 64;
            if (midiOut) midiOut.send([0xE0 + activeChan, 0, 64]);
        };

        document.getElementById('btn-panic').onclick = () => {
            if (midiOut) midiOut.send([0xB0 + activeChan, 123, 0]);
            log("Panic Sent (CH " + (activeChan+1) + ")");
        };

        const presets = [
            { n: "A1 First", v: 0 }, { n: "B74 Short", v: 1 }, { n: "B74 Long", v: 2 },
            { n: "B3 Organ", v: 3 }, { n: "Indigo 84", v: 4 }, { n: "Virus A18", v: 5 },
            { n: "Piano", v: 6 }, { n: "Movie Str", v: 7 }, { n: "Organ Int", v: 8 },
            { n: "Atmo Real", v: 9 }, { n: "Pad Exp", v: 10 }, { n: "Outer W", v: 11 }
        ];

        const grid = document.getElementById('pad-grid');
        presets.forEach((item) => {
            const btn = document.createElement('button');
            btn.className = 'midi-pad';
            btn.innerText = item.n;
            btn.onclick = () => {
                document.querySelectorAll('.midi-pad').forEach(b => b.classList.remove('selected'));
                btn.classList.add('selected');
                if (midiOut) midiOut.send([0xB0 + activeChan, 27, item.v]);
            };
            grid.appendChild(btn);
        });

        document.getElementById('btn-init').onclick = initMidi;
    </script>
</body>
</html>
