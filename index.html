<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Virus Red / Cine Purple</title>
    <style>
        /* CSS Variables for Dynamic Colors */
        :root { --accent: #ff3333; --bg: #0d0d0d; --panel: #1a1a1a; }
        
        /* Cinematic Theme Class */
        .theme-cine { --accent: #a044ff; }

        html, body { height: 100%; margin: 0; padding: 0; overflow: hidden; background: var(--bg); color: white; font-family: sans-serif; }
        body { display: flex; flex-direction: column; transition: background 0.3s; }
        
        .setup-bar { background: #222; padding: 8px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #444; gap: 5px; flex-shrink: 0; }
        .btn-header { border: none; padding: 10px; border-radius: 4px; font-weight: bold; cursor: pointer; font-size: 10px; color: white; transition: 0.2s; }
        select { background: #333; color: white; border: 1px solid #555; padding: 8px; border-radius: 4px; flex-grow: 1; font-size: 12px; }
        
        .tabs { display: flex; background: #111; border-bottom: 2px solid #333; flex-shrink: 0; }
        .tab { flex: 1; padding: 15px; text-align: center; cursor: pointer; font-weight: bold; color: #666; font-size: 13px; transition: 0.3s; }
        .tab.active { background: var(--panel); color: var(--accent); border-bottom: 3px solid var(--accent); }
        
        .main-container { display: flex; flex: 1; padding: 10px; gap: 10px; overflow: hidden; }
        
        .fader-section { width: 38%; background: var(--panel); border-radius: 10px; padding: 10px; border: 1px solid #333; display: flex; flex-direction: column; flex-shrink: 0; }
        .v-fader-row { display: flex; flex: 1; justify-content: space-around; margin-bottom: 5px; }
        .fader-group { display: flex; flex-direction: column; align-items: center; justify-content: space-between; height: 100%; }
        .fader-label { color: #888; font-size: 9px; text-transform: uppercase; font-weight: bold; text-align: center; min-height: 20px; }
        
        /* The Fader Styling */
        input[type=range][orient=vertical] { appearance: slider-vertical; width: 32px; height: 75%; background: #333; cursor: pointer; }
        
        .macro-container { border-top: 1px solid #444; padding-top: 10px; text-align: center; flex-shrink: 0; }
        .val-indicator { color: var(--accent); font-family: monospace; font-size: 12px; background: #000; padding: 2px 6px; border-radius: 4px; margin-top: 4px; border: 1px solid #333; }

        /* Buttons */
        .scroll-wrapper { width: 62%; height: 100%; overflow-y: scroll; -webkit-overflow-scrolling: touch; }
        #pad-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; padding-bottom: 120px; }
        
        .midi-pad { background: #252525; border: none; border-radius: 8px; color: #bbb; font-size: 12px; font-weight: 700; height: 75px; cursor: pointer; border-bottom: 4px solid #000; transition: 0.1s; }
        .midi-pad:active, .midi-pad.selected { background: var(--accent); color: white; border-bottom: 0px; transform: translateY(3px); }

        #debug-box { background: #000; color: var(--accent); font-family: monospace; font-size: 11px; padding: 10px; border-top: 1px solid #333; flex-shrink: 0; }
    </style>
</head>
<body id="app-body">

    <div class="setup-bar">
        <button id="btn-init" class="btn-header" style="background:var(--accent)">INIT USB</button>
        <select id="midi-select"><option>Midi Port...</option></select>
        <button id="btn-fs" class="btn-header" style="background:#444">FS</button>
        <button id="btn-panic" class="btn-header" style="background:#900">PANIC</button>
    </div>

    <div class="tabs">
        <div id="tab-v-btn" class="tab active" onclick="updateLayout('virus')">VIRUS (CH 3)</div>
        <div id="tab-c-btn" class="tab" onclick="updateLayout('cine')">CINEMATIC (CH 4)</div>
    </div>

    <div class="main-container">
        <div class="fader-section">
            <div class="v-fader-row">
                <div class="fader-group"><div class="fader-label" id="l-p">Pitch</div><input type="range" id="pitch" orient="vertical" min="0" max="127" value="64"><div class="val-indicator" id="v-pitch">64</div></div>
                <div class="fader-group"><div class="fader-label" id="l-1">Mod W</div><input type="range" id="f1" orient="vertical" min="0" max="127" value="0" oninput="upd(1, this.value, 'v1')"><div class="val-indicator" id="v1">0</div></div>
                <div class="fader-group"><div class="fader-label" id="l-2">Rel</div><input type="range" id="f2" orient="vertical" min="0" max="127" value="0" oninput="upd(7, this.value, 'v2')"><div class="val-indicator" id="v2">0</div></div>
                <div class="fader-group"><div class="fader-label" id="l-3">Mod K</div><input type="range" id="f3" orient="vertical" min="0" max="127" value="0" oninput="upd(30, this.value, 'v3')"><div class="val-indicator" id="v3">0</div></div>
            </div>
            <div class="macro-container">
                <div class="fader-label">Master (CC 20)</div>
                <input type="range" id="macro-slider" style="width:100%" min="0" max="64" value="0" oninput="upd(20, this.value, 'v-m')">
                <div class="val-indicator" id="v-m">0</div>
            </div>
        </div>

        <div class="scroll-wrapper">
            <div id="pad-grid"></div>
        </div>
    </div>

    <div id="debug-box">> System Ready.</div>

    <script>
        let midiOut = null;
        let activeChan = 2; 

        const virusPresets = [
            { n: "A1 First", v: 0 }, { n: "B74 Short", v: 1 }, { n: "B74 Long", v: 2 },
            { n: "B3 Organ", v: 3 }, { n: "Indigo 84", v: 4 }, { n: "Virus A18", v: 5 },
            { n: "Piano", v: 6 }, { n: "Movie Str", v: 7 }, { n: "Organ Int", v: 8 },
            { n: "Atmo Real", v: 9 }, { n: "Pad Exp", v: 10 }, { n: "Outer W", v: 11 },
            { n: "Pad Stellar", v: 12 }, { n: "Man Steel", v: 13 }, { n: "Braaam", v: 14 },
            { n: "Drone", v: 15 }, { n: "Cinematic", v: 16 }, { n: "NinthHvn", v: 17 },
            { n: "I Made This", v: 18 }, { n: "Space Brass", v: 19 }, { n: "Crystal", v: 20 }
        ];

        const cinePresets = [
            { n: "TEST (PC 1)", v: 0, type: "pc" }
        ];

        function updateLayout(mode) {
            const grid = document.getElementById('pad-grid');
            const body = document.getElementById('app-body');
            grid.innerHTML = '';
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            
            if(mode === 'virus') {
                activeChan = 2;
                body.classList.remove('theme-cine');
                document.getElementById('tab-v-btn').classList.add('active');
                setLabels("Pitch", "Mod W", "Rel", "Mod K");
                buildGrid(virusPresets);
            } else {
                activeChan = 3;
                body.classList.add('theme-cine');
                document.getElementById('tab-c-btn').classList.add('active');
                setLabels("Expr", "Timbre", "Vib", "Dyn");
                buildGrid(cinePresets);
            }
            log("Switched to " + mode.toUpperCase());
        }

        function setLabels(p, f1, f2, f3) {
            document.getElementById('l-p').innerText = p;
            document.getElementById('l-1').innerText = f1;
            document.getElementById('l-2').innerText = f2
