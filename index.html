<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Virus Controller Master</title>
    <style>
        :root { --virus-red: #ff3333; --cine-purple: #a044ff; --bg: #0d0d0d; --panel: #1a1a1a; }
        
        html, body { height: 100%; margin: 0; padding: 0; overflow: hidden; background: var(--bg); color: white; font-family: sans-serif; }
        body { display: flex; flex-direction: column; }
        
        /* Header & Tabs */
        .setup-bar { background: #222; padding: 10px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #444; flex-shrink: 0; }
        .btn-header { border: none; padding: 10px; border-radius: 4px; font-weight: bold; cursor: pointer; font-size: 11px; color: white; }
        select { background: #333; color: white; border: 1px solid #555; padding: 8px; border-radius: 4px; flex-grow: 1; margin: 0 10px; }
        
        .tabs { display: flex; background: #111; border-bottom: 2px solid #333; flex-shrink: 0; }
        .tab { flex: 1; padding: 15px; text-align: center; cursor: pointer; font-weight: bold; color: #666; }
        .tab.v-active { background: var(--panel); color: var(--virus-red); border-bottom: 3px solid var(--virus-red); }
        .tab.c-active { background: var(--panel); color: var(--cine-purple); border-bottom: 3px solid var(--cine-purple); }
        
        /* Main Layout */
        .main-container { display: flex; flex: 1; padding: 10px; gap: 15px; overflow: hidden; }
        
        /* Fader Styling - FORCED COLORS */
        .fader-section { width: 38%; background: var(--panel); border-radius: 12px; padding: 15px; border: 1px solid #333; display: flex; flex-direction: column; }
        .v-fader-row { display: flex; flex: 1; justify-content: space-around; align-items: stretch; margin-bottom: 10px; }
        .fader-group { display: flex; flex-direction: column; align-items: center; justify-content: space-between; }
        .fader-label { color: #888; font-size: 10px; text-transform: uppercase; font-weight: bold; text-align: center; min-height: 24px; }
        
        /* Red Faders for Virus */
        .virus-mode input[type=range] { accent-color: var(--virus-red); }
        .virus-mode .val-indicator { color: var(--virus-red); border: 1px solid var(--virus-red); }
        
        /* Purple Faders for Cine */
        .cine-mode input[type=range] { accent-color: var(--cine-purple); }
        .cine-mode .val-indicator { color: var(--cine-purple); border: 1px solid var(--cine-purple); }
        
        input[type=range][orient=vertical] { appearance: slider-vertical; width: 35px; height: 100%; background: #333; cursor: pointer; }
        
        .val-indicator { font-family: monospace; font-size: 12px; background: #000; padding: 2px 6px; border-radius: 4px; margin-top: 5px; }

        /* Button Column Scrolling */
        .scroll-wrapper { width: 62%; height: 100%; overflow-y: auto; -webkit-overflow-scrolling: touch; }
        .button-grid { display: none; grid-template-columns: repeat(2, 1fr); gap: 10px; padding-bottom: 100px; }
        .button-grid.active { display: grid; }
        
        .midi-pad { background: #252525; border: none; border-radius: 8px; color: #bbb; font-size: 13px; font-weight: 700; min-height: 70px; cursor: pointer; border-bottom: 4px solid #000; }
        
        /* Virus Accent */
        .virus-mode .midi-pad:active, .virus-mode .midi-pad.selected { background: var(--virus-red); color: white; border-bottom: 0px; transform: translateY(3px); }
        /* Cine Accent */
        .cine-mode .midi-pad:active, .cine-mode .midi-pad.selected { background: var(--cine-purple); color: white; border-bottom: 0px; transform: translateY(3px); }

        #debug-box { background: #000; color: #666; font-family: monospace; font-size: 11px; padding: 10px; border-top: 1px solid #333; flex-shrink: 0; }
    </style>
</head>

        <button id="btn-panic" class="btn-header" style="background:#900">PANIC</button>

    </div>
