<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Virus & Cinematic Master</title>
    <style>
        :root { --accent: #ff3333; --bg: #0d0d0d; --panel: #1a1a1a; --active-bg: #ff3333; }
        
        html, body { height: 100%; margin: 0; padding: 0; overflow: hidden; background: var(--bg); color: white; font-family: 'Inter', sans-serif; }
        body { display: flex; flex-direction: column; }
        
        .setup-bar { background: #222; padding: 8px 15px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #444; flex-shrink: 0; gap: 5px; }
        .tabs { display: flex; background: #111; border-bottom: 2px solid #333; flex-shrink: 0; }
        .tab { flex: 1; padding: 12px; text-align: center; cursor: pointer; font-weight: bold; color: #666; font-size: 13px; }
        .tab.active { background: var(--panel); color: var(--accent); border-bottom: 3px solid var(--accent); }
        
        /* Layout Container */
        .main-container { display: flex; flex: 1; padding: 10px; gap: 10px; overflow: hidden; height: calc(100% - 110px); }
        
        /* Fader Panel */
        .fader-section { display: flex; flex-direction: column; width: 35%; background: var(--panel); border-radius: 12px; padding: 10px; border: 1px solid #333; height: 100%; box-sizing: border-box; }
        .v-fader-row { display: flex; flex: 1; justify-content: space-around; min-height: 0; }
        .fader-group { display: flex; flex-direction: column; align-items: center; justify-content: space-between; height: 100%; }
        .fader-label { color: #888; font-size: 9px; text-transform: uppercase; font-weight: bold; height: 25px; text-align: center; }
        input[type=range][orient=vertical] { appearance: slider-vertical; width: 32px; height: 70%; background: #333; }
        
        .macro-container { border-top: 1px solid #333; padding-top: 8px; display: flex; flex-direction: column; align-items: center; gap: 4px; flex-shrink: 0; }
        input[id=macro-slider] { appearance: none; width: 90%; height: 8px; background: #333; border-radius: 4px; }
        input[id=macro-slider]::-webkit-slider-thumb { appearance: none; width: 22px; height: 22px; background: var(--accent); border-radius: 50%; border: 2px solid #fff; }
        
        /* FULL SCROLLABLE BUTTON SECTION */
        .button-section { 
            width: 65%; 
            display: grid; 
            grid-template-columns: repeat(2, 1fr); 
            gap: 10px; 
            overflow-y: scroll; 
            height: 100%;
            padding-bottom: 40px; 
            -webkit-overflow-scrolling: touch; 
        }
        .midi-pad { background: #252525; border: none; border-radius: 8px; color: #bbb; font-size: 13px; font-weight: 700; height: 65px; cursor: pointer; border-bottom: 4px solid #000; display: flex; align-items: center; justify-content: center; text-align: center; padding: 5px; }
        .midi-pad.selected { background: var(--accent); color: #fff; border-bottom: 0px; transform: translateY(3px); }

        #debug-box { background: #000; color: #ff3333; font-family: monospace; font-size: 10px; height: 30px; padding: 5px 15px; border-top: 1px solid #333; flex-shrink: 0; }
        .val-indicator { color: var(--accent); font-family: monospace; font-size: 10px; background: #000; padding: 1px 4px; border-radius: 3px; }
        
        .btn-header { border: none; padding: 8px 10px; border-radius: 4px; font-weight: bold; cursor: pointer; font-size: 10px; white-space: nowrap; }
    </style>
</head>
<body>

    <div class="setup-bar">
        <button id="btn-init" class="btn-header" style="background:#ff3333; color:white;">INIT USB</button>
        <select id="midi-select" style="background:#333; color:white; border:1px solid #555; padding:6px; border-radius:4px; flex-grow: 1;"><option>Midi Port...</option></select>
        <button id="btn-fs" class="btn-header" style="background:#444; color:white;">FULLSCREEN</button>
        <button id="btn-panic" class="btn-header" style="background:#990000; color:white;">PANIC</button>
    </div>

    <div class="tabs">
        <div id="tab-v" class="tab active" onclick="updateLayout('virus')">VIRUS (CH 3)</div>
        <div id="tab-c" class="tab" onclick="updateLayout('cinematic')">CINEMATIC (CH 4)</div>
    </div>

    <div class="main-container">
        <div class="fader-section">
            <div class="v-fader-row">
                <div class="fader-group"><div class="fader-label" id="lbl-p">Pitch</div><input type="range" id="pitch" orient="vertical" min="0" max="127" value="64"><div class="val-indicator" id="v-pitch">64</div></div>
                <div class="fader-group"><div class="fader-label" id="lbl-f1">Mod W</div><input type="range" id="f1" orient="vertical" min="0" max="127" value="0" oninput="updateFader(1, this.value, 'v1')"><div class="val-indicator" id="v1">0</div></div>
                <div class="fader-group"><div class="fader-label" id="lbl-f2">Rel</div><input type="range" id="f2" orient="vertical" min="0" max="127" value="0" oninput="updateFader(7, this.value, 'v2')"><div class="val-indicator" id="v2">0</div></div>
                <div class="fader-group"><div class="fader-label" id="lbl-f3">Mod K</div><input type="range" id="f3" orient="vertical" min="0" max="127" value="0" oninput="updateFader(30, this.value, 'v3')"><div class="val-indicator" id="v3">0</div></div>
            </div>
            <div class="macro-container">
                <div class="fader-label">Master (CC 20)</div>
                <input type="range" id="macro-slider" min="0" max="64" value="0" oninput="updateFader(20, this.value, 'v-macro')">
                <div class="val-indicator" id="v-macro">0</div>
            </div>
        </div>
        <div class="button-section" id="pad-grid"></div>
    </div>

    <div id="debug-box">> System Ready.</div>
